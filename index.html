<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>MapleStory Clone</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; }
body { background: #1a0a2e; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Courier New', monospace; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
canvas { display: block; border: 2px solid #4a2a7a; image-rendering: pixelated; max-width: 100vw; max-height: 100vh; max-height: 100dvh; }

/* ─── Touch controls ─── */
#touch { position: fixed; inset: 0; z-index: 10; pointer-events: none; display: none; }
#touch.active { display: block; }
.tbtn {
  position: fixed;
  pointer-events: auto;
  display: flex; align-items: center; justify-content: center;
  font-family: monospace; font-weight: bold; color: #fff; text-align: center; line-height: 1.1;
  background: rgba(40, 20, 70, 0.5);
  border: 2px solid rgba(150, 110, 210, 0.7);
  border-radius: 50%;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none; user-select: none;
  touch-action: none;
  text-shadow: 0 1px 2px #000;
}
.tbtn small { font-size: 0.62em; opacity: 0.85; font-weight: normal; }
.tbtn.held { background: rgba(130, 90, 210, 0.85); border-color: #cbb0ff; }
/* Movement cluster — bottom left */
#bLeft  { left: 16px;  bottom: 96px; width: 66px; height: 66px; font-size: 26px; }
#bRight { left: 92px;  bottom: 96px; width: 66px; height: 66px; font-size: 26px; }
#bDown  { left: 54px;  bottom: 22px; width: 66px; height: 66px; font-size: 13px; }
/* Action cluster — bottom right */
#bJump  { right: 16px; bottom: 96px; width: 78px; height: 78px; font-size: 13px; background: rgba(30,80,120,0.5); border-color: rgba(90,180,230,0.8); }
#bAtk   { right: 104px; bottom: 116px; width: 66px; height: 66px; font-size: 13px; background: rgba(120,60,30,0.5); border-color: rgba(230,150,90,0.8); }
/* Skills — right edge column */
#bQ { right: 18px;  bottom: 192px; width: 50px; height: 50px; font-size: 12px; }
#bE { right: 78px;  bottom: 214px; width: 50px; height: 50px; font-size: 12px; }
#bR { right: 138px; bottom: 192px; width: 50px; height: 50px; font-size: 12px; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="touch">
  <div class="tbtn" id="bLeft"  data-code="ArrowLeft">◀</div>
  <div class="tbtn" id="bRight" data-code="ArrowRight">▶</div>
  <div class="tbtn" id="bDown"  data-code="ArrowDown">DROP<br><small>▼</small></div>
  <div class="tbtn" id="bJump"  data-code="Space">JUMP<br><small>▲ ×2</small></div>
  <div class="tbtn" id="bAtk"   data-code="KeyZ">ATK<br><small>Z</small></div>
  <div class="tbtn" id="bQ" data-code="KeyQ">Q</div>
  <div class="tbtn" id="bE" data-code="KeyE">E</div>
  <div class="tbtn" id="bR" data-code="KeyR">R</div>
</div>

const ctx = canvas.getContext('2d');

const W = 960, H = 540;
canvas.width = W;
canvas.height = H;

// ─── Constants ───────────────────────────────────────────────────────────────

const ATTACK_RANGE = 70;
const ATTACK_COOLDOWN = 400;

// ─── Input ────────────────────────────────────────────────────────────────────
const keys = {};
document.addEventListener('keydown', e => {
  if (!keys[e.code]) {
    keys[e.code] = true;
    handleKeyPress(e.code);
  }
  e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

// ─── Touch controls ───────────────────────────────────────────────────────────
// Reuse the keyboard model: held buttons set keys[code], presses fire handleKeyPress.
let touchEl = null;
const isTouchDevice = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
(function setupTouch() {
  touchEl = document.getElementById('touch');
  const isTouch = isTouchDevice;
  if (isTouch) touchEl.classList.add('active');

  function pressCode(code) {
    if (!keys[code]) {            // mirror the keydown debounce
      keys[code] = true;
      handleKeyPress(code);
    }
  }
  function releaseCode(code) { keys[code] = false; }

  document.querySelectorAll('.tbtn').forEach(btn => {
    const code = btn.dataset.code;
    const down = e => { e.preventDefault(); btn.classList.add('held'); pressCode(code); };
    const up   = e => { e.preventDefault(); btn.classList.remove('held'); releaseCode(code); };
    btn.addEventListener('touchstart', down, { passive: false });
    btn.addEventListener('touchend', up, { passive: false });
    btn.addEventListener('touchcancel', up, { passive: false });
    // Mouse fallback for desktop testing
    btn.addEventListener('mousedown', down);
    btn.addEventListener('mouseup', up);
    btn.addEventListener('mouseleave', e => { if (btn.classList.contains('held')) up(e); });
  });
})();

// Tap directly on a class card to pick it (in addition to ◀ ▶ + confirm button).
function canvasPoint(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  return { x: (clientX - r.left) * (W / r.width), y: (clientY - r.top) * (H / r.height) };
}
function handleCanvasTap(cx, cy) {
  if (gameState === 'classselect') {
    const cardW = 250, gap = 30;
    const total = CLASSES.length * cardW + (CLASSES.length - 1) * gap;
    const startX = W / 2 - total / 2;
    for (let i = 0; i < CLASSES.length; i++) {
      const x = startX + i * (cardW + gap);
      if (cx >= x && cx <= x + cardW && cy >= 150 && cy <= 430) {
        if (classHover === i) startGame(i); else classHover = i;
        return;
      }
    }
  }
}
canvas.addEventListener('click', e => { const p = canvasPoint(e.clientX, e.clientY); handleCanvasTap(p.x, p.y); });
canvas.addEventListener('touchstart', e => {
  if (gameState !== 'classselect') return;
  e.preventDefault();
  const t = e.changedTouches[0];
  const p = canvasPoint(t.clientX, t.clientY);
  handleCanvasTap(p.x, p.y);
}, { passive: false });

// ─── Particle System ──────────────────────────────────────────────────────────
const particles = [];
function spawnParticles(x, y, color, count = 6) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 5,
      vy: Math.random() * -4 - 1,
      life: 1, decay: 0.04 + Math.random() * 0.03,
      size: 3 + Math.random() * 4,
      color
    });
  }
}
function spawnDamageNumber(x, y, dmg, color = '#fff') {
  particles.push({
    type: 'text', x, y,
    vy: -2, life: 1, decay: 0.025,
    text: dmg, color
  });
}

// ─── Enemy factory ────────────────────────────────────────────────────────────
function makeEnemy(x, y, name, hp, atk, color, exp) {
  return {
    x, y: y - 36, w: 36, h: 36,
    name, color, exp,
    hp, maxHp: hp, atk,
    vx: (Math.random() < 0.5 ? -1 : 1),
    vy: 0, onGround: false,
    dir: 1, patrolTimer: 0,
    attackCooldown: 0, alive: true,
    hitFlash: 0, spawnX: x,
    patrolRange: 120 + Math.random() * 60,
    animFrame: 0, animTimer: 0,
  };
}

  { name: 'Meso', color: '#FFD700', value: 1, isMeso: true },
  { name: 'HP Potion', color: '#FF4466', healHp: 80 },
  { name: 'MP Potion', color: '#4466FF', healMp: 50 },
  { name: 'Power Elixir', color: '#FF88FF', healHp: 300, healMp: 200 },
  { name: 'Shoe Drop', color: '#88AAFF', isEquip: true, stat: 'spd', statVal: 1 },
  { name: 'Sword Drop', color: '#FFCC44', isEquip: true, stat: 'atk', statVal: 5 },
];

function spawnDrop(x, y, mapId) {
  const r = Math.random();
  let item;
  if (r < 0.55) {
    item = { ...ITEM_TYPES[0], value: 10 + Math.floor(Math.random() * 50 * (mapId + 1)) };
  } else if (r < 0.75) {
    item = { ...ITEM_TYPES[1] };
  } else if (r < 0.82) {
    item = { ...ITEM_TYPES[2] };
  } else if (r < 0.88) {
    item = { ...ITEM_TYPES[3] };
  } else if (r < 0.94) {
    item = { ...ITEM_TYPES[4] };
  } else {
    item = { ...ITEM_TYPES[5] };
  }
  drops.push({
    ...item,
    x: x + (Math.random() - 0.5) * 60,
    y: y - 10,
    vy: -5, vx: (Math.random() - 0.5) * 3,
    life: 600, glowPhase: 0,
  });
}

// ─── Player ───────────────────────────────────────────────────────────────────
const player = {
  x: 120, y: 380,
  w: 30, h: 42,
  vx: 0, vy: 0,
  dir: 1,
  onGround: false,
  jumpsLeft: 2,
  // Class
  cls: CLASSES[0],
  // Stats
  level: 1, exp: 0, expNeeded: 100,
  hp: 280, maxHp: 280,
  mp: 60, maxMp: 60,
  atk: 24, baseAtk: 24, spd: 0,
  meso: 0,
  // State
  attacking: false,
  attackTimer: 0,
  attackCooldown: 0,
  invincible: 0,
  animFrame: 0,
  animTimer: 0,
  state: 'idle',
  buffAtk: 1, buffTimer: 0,
  skills: CLASSES[0].skills,
  inventory: [],
};

function applyClass(cls) {
  player.cls = cls;
  player.maxHp = cls.maxHp; player.hp = cls.maxHp;
  player.maxMp = cls.maxMp; player.mp = cls.maxMp;
  player.atk = cls.atk; player.baseAtk = cls.atk;
  player.spd = cls.spd;
  // Fresh skill objects so cooldowns don't leak between classes
  player.skills = cls.skills.map(s => ({ ...s, cooldown: 0 }));
}

// Effective attack including Rage buff
function playerAtk() { return player.atk * (player.buffTimer > 0 ? player.buffAtk : 1); }

// ─── Projectiles & skill effects ───────────────────────────────────────────────
const projectiles = [];
const effects = [];
function spawnEffect(o) { o.maxLife = o.life; effects.push(o); }

// ─── Game state ───────────────────────────────────────────────────────────────
let currentMapIdx = 0;
let map = MAPS[0];
let enemies = [];
let camera = { x: 0, y: 0 };
let gameState = 'classselect'; // 'classselect' | 'playing' | 'dead' | 'levelup' | 'nextmap'
let levelUpTimer = 0;
let nextMapTimer = 0;
let totalMobsKilled = 0;
let classHover = 0;

function startGame(classIdx) {
  applyClass(CLASSES[classIdx]);
  player.level = 1; player.exp = 0; player.expNeeded = 100;
  player.meso = 0; totalMobsKilled = 0;
  player.buffTimer = 0; player.buffAtk = 1;
  loadMap(0);
  gameState = 'playing';
}

function loadMap(idx) {
  currentMapIdx = idx;
  map = MAPS[idx];
  drops.length = 0;
  projectiles.length = 0;
  particles.length = 0;
  enemies = map.spawnEnemies();
  player.x = 120;
  player.y = map.ground - player.h;
  player.vx = 0;
  player.vy = 0;
  camera.x = 0;
}

loadMap(0);

// ─── Input handler ────────────────────────────────────────────────────────────
function handleKeyPress(code) {
  if (gameState === 'classselect') {
    if (code === 'ArrowLeft' || code === 'KeyA') classHover = (classHover + CLASSES.length - 1) % CLASSES.length;
    if (code === 'ArrowRight' || code === 'KeyD') classHover = (classHover + 1) % CLASSES.length;
    if (code === 'Digit1') { classHover = 0; }
    if (code === 'Digit2') { classHover = 1; }
    if (code === 'Digit3') { classHover = 2; }
    if (code === 'Space' || code === 'Enter' || code === 'KeyZ') startGame(classHover);
    return;
  }
  if (gameState === 'dead') {
    if (code === 'Space' || code === 'Enter') respawn();
    return;
  }
  if (gameState !== 'playing') return;

  if (code === 'ArrowUp' || code === 'KeyW' || code === 'Space') {
    if (player.jumpsLeft > 0) {
      player.vy = JUMP_FORCE * (player.jumpsLeft === 1 ? 0.85 : 1);
      player.jumpsLeft--;
      player.onGround = false;
      spawnParticles(player.x + player.w / 2, player.y + player.h, '#cceeff', 4);
    }
  }
  if (code === 'KeyZ' || code === 'KeyA') {
    doBasicAttack();
  }
  for (const skill of player.skills) {
    if (code === skill.key) {
      useSkill(skill);
    }
  }
  if (code === 'KeyF') {
    pickupNearby();
  }
}

function respawn() {
  player.hp = player.maxHp;
  player.mp = player.maxMp;
  player.exp = Math.floor(player.exp * 0.9);
  player.meso = Math.floor(player.meso * 0.9);
  loadMap(currentMapIdx);
  gameState = 'playing';
}

// ─── Combat ───────────────────────────────────────────────────────────────────
function doBasicAttack() {
  if (player.attackCooldown > 0) return;
  player.attacking = true;
  player.attackTimer = 260;
  player.attackCooldown = ATTACK_COOLDOWN;
  const weapon = player.cls.weapon;
  const cx = player.x + player.w / 2, cy = player.y + player.h / 2;

  if (weapon === 'bow' || weapon === 'staff') {
    // Ranged classes fire a weak basic shot
    projectiles.push({
      x: cx + player.dir * 16, y: cy,
      vx: player.dir * 9, vy: 0,
      dmg: Math.floor(playerAtk() * (0.9 + Math.random() * 0.2)),
      color: weapon === 'bow' ? '#e8d090' : '#9fd0ff',
      life: 65, fx: weapon === 'bow' ? 'arrow' : 'bolt', dir: player.dir,
    });
    return;
  }
  // Melee swing
  const px = player.x + (player.dir > 0 ? player.w : -ATTACK_RANGE);
  spawnEffect({ type: 'slash', x: player.x + (player.dir > 0 ? player.w : 0), y: player.y, dir: player.dir, color: '#ffffff', life: 8, range: ATTACK_RANGE });
  for (const e of enemies) {
    if (!e.alive) continue;
    if (rectsOverlap(px, player.y, ATTACK_RANGE, player.h + 10, e.x, e.y, e.w, e.h)) {
      hitEnemy(e, Math.floor(playerAtk() * (0.9 + Math.random() * 0.2)), '#fff');
    }
  }
}

function useSkill(skill) {
  if (gameState !== 'playing') return;
  if (skill.cooldown > 0 || player.mp < skill.mpCost) return;
  player.mp -= skill.mpCost;
  skill.cooldown = skill.maxCd;
  player.attacking = true;
  player.attackTimer = 240;
  const cx = player.x + player.w / 2, cy = player.y + player.h / 2;

  // ── Self-buff (Rage) ──
  if (skill.fx === 'buff') {
    player.buffAtk = skill.buffAtk;
    player.buffTimer = skill.buffDur;
    spawnEffect({ type: 'buff', x: cx, y: player.y + 20, color: skill.color, life: 36 });
    spawnParticles(cx, cy, skill.color, 26);
    spawnDamageNumber(cx, player.y - 12, 'RAGE!', skill.color);
    return;
  }

  // ── Projectile skills (Energy Bolt, Magic Claw, Arrow Blow, Double Shot) ──
  if (skill.projectile) {
    const n = skill.multi || 1;
    for (let i = 0; i < n; i++) {
      const spread = (i - (n - 1) / 2);
      projectiles.push({
        x: cx + player.dir * 16,
        y: cy + spread * 8,
        vx: player.dir * (skill.fx === 'arrow' ? 13 : 10),
        vy: skill.fx === 'claw' ? spread * 1.4 : 0,
        dmg: Math.floor(playerAtk() * skill.dmgMult),
        color: skill.color, life: 80, fx: skill.fx, dir: player.dir,
      });
    }
    spawnParticles(cx + player.dir * 14, cy, skill.color, 8);
    return;
  }

  // ── Full-area burst (Thunder Bolt, Arrow Rain) ──
  if (skill.aoeFull) {
    const R = 210;
    spawnEffect({ type: skill.fx, x: cx, y: player.y, color: skill.color, life: skill.fx === 'rain' ? 26 : 18, r: R });
    for (const e of enemies) {
      if (!e.alive) continue;
      const ex = e.x + e.w / 2, ey = e.y + e.h / 2;
      if (Math.abs(ex - cx) < R && Math.abs(ey - cy) < 170) {
        hitEnemy(e, Math.floor(playerAtk() * skill.dmgMult * (0.85 + Math.random() * 0.3)), skill.color);
      }
    }
    return;
  }

  // ── Melee arcs (Power Strike, Slash Blast) ──
  const range = skill.range || ATTACK_RANGE;
  spawnEffect({ type: skill.fx, x: player.x + (player.dir > 0 ? player.w : 0), y: player.y, dir: player.dir, color: skill.color, life: 14, range });
  const px = player.x + (player.dir > 0 ? player.w : -range);
  for (const e of enemies) {
    if (!e.alive) continue;
    if (rectsOverlap(px, player.y - 15, range, player.h + 30, e.x, e.y, e.w, e.h)) {
      hitEnemy(e, Math.floor(playerAtk() * skill.dmgMult * (0.9 + Math.random() * 0.2)), skill.color);
    }
  }
}

function hitEnemy(e, dmg, color) {
  e.hp -= dmg;
  e.hitFlash = 8;
  spawnDamageNumber(e.x + e.w / 2, e.y - 5, dmg, color);
  spawnParticles(e.x + e.w / 2, e.y + e.h / 2, color, 4);
  if (e.hp <= 0) killEnemy(e);
}

function killEnemy(e) {
  e.alive = false;
  totalMobsKilled++;
  spawnParticles(e.x + e.w / 2, e.y + e.h / 2, e.color, 12);
  spawnDrop(e.x + e.w / 2, e.y + e.h, currentMapIdx);
  gainExp(e.exp);
}

function gainExp(amount) {
  player.exp += amount;
  while (player.exp >= player.expNeeded) {
    player.exp -= player.expNeeded;
    levelUp();
  }
}

function levelUp() {
  const c = player.cls;
  player.level++;
  player.expNeeded = Math.floor(100 * Math.pow(1.3, player.level - 1));
  player.maxHp += c.hpPerLv;
  player.maxMp += c.mpPerLv;
  player.hp = player.maxHp;
  player.mp = player.maxMp;
  player.atk += c.atkPerLv;
  player.baseAtk += c.atkPerLv;
  gameState = 'levelup';
  levelUpTimer = 120;
  spawnParticles(player.x + player.w / 2, player.y, '#FFD700', 20);
}

function pickupNearby() {
  for (let i = drops.length - 1; i >= 0; i--) {
    const d = drops[i];
    const dist = Math.hypot(d.x - (player.x + player.w / 2), d.y - (player.y + player.h / 2));
    if (dist < 60) {
      applyItem(d);
      drops.splice(i, 1);
    }
  }
}

function applyItem(item) {
  if (item.isMeso) {
    player.meso += item.value;
    spawnParticles(player.x + 15, player.y + 10, '#FFD700', 4);
  } else if (item.healHp) {
    player.hp = Math.min(player.maxHp, player.hp + item.healHp);
    spawnParticles(player.x + 15, player.y + 10, '#FF4466', 4);
    if (item.healMp) player.mp = Math.min(player.maxMp, player.mp + item.healMp);
  } else if (item.healMp) {
    player.mp = Math.min(player.maxMp, player.mp + item.healMp);
    spawnParticles(player.x + 15, player.y + 10, '#4466FF', 4);
  } else if (item.isEquip) {
    if (item.stat === 'atk') player.atk += item.statVal;
    if (item.stat === 'spd') player.spd += item.statVal;
    spawnParticles(player.x + 15, player.y + 10, '#88AAFF', 6);
  }
}

// ─── Collision Helpers ────────────────────────────────────────────────────────
function rectsOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

function getAllSurfaces() {
  const surfaces = [];
  // Ground
  surfaces.push({ x: -1000, y: map.ground, w: map.width + 2000, h: 200, isGround: true });
  // Map walls
  surfaces.push({ x: -50, y: 0, w: 50, h: map.ground + 200, isWall: true, wallRight: true });
  surfaces.push({ x: map.width, y: 0, w: 50, h: map.ground + 200, isWall: true, wallLeft: true });
  // Platforms
  for (const p of map.platforms) {
    surfaces.push({ x: p.x, y: p.y, w: p.w, h: 14, isPlatform: true });
  }
  return surfaces;
}

function applyPhysics(obj, canFallThrough = false) {
  obj.vy += GRAVITY;
  if (obj.vy > 18) obj.vy = 18;

  const surfaces = getAllSurfaces();
  const prevY = obj.y;
  const prevOnGround = obj.onGround;
  obj.onGround = false;

  obj.x += obj.vx;
  // Horizontal wall check
  for (const s of surfaces) {
    if (s.isWall) {
      if (s.wallRight && obj.x < s.x + s.w && obj.x > s.x) obj.x = s.x + s.w;
      if (s.wallLeft && obj.x + obj.w > s.x && obj.x < s.x) obj.x = s.x - obj.w;
    }
  }

  obj.y += obj.vy;
  // Vertical collision
  for (const s of surfaces) {
    if (s.isWall) continue;
    if (obj.x + obj.w <= s.x || obj.x >= s.x + s.w) continue;
    if (s.isPlatform && canFallThrough) continue;
    // Landing on top
    if (obj.vy >= 0 && prevY + obj.h <= s.y + 4 && obj.y + obj.h >= s.y) {
      obj.y = s.y - obj.h;
      obj.vy = 0;
      obj.onGround = true;
    }
    // Hitting from below (only for solid ground)
    if (!s.isPlatform && obj.vy < 0 && prevY >= s.y + s.h - 4 && obj.y < s.y + s.h) {
      obj.y = s.y + s.h;
      obj.vy = 0;
    }
  }
}

// ─── Update ───────────────────────────────────────────────────────────────────
let lastTime = 0;
function update(ts) {
  const dt = Math.min(ts - lastTime, 50);
  lastTime = ts;

  // Show the on-screen pad only during active play
  if (touchEl && isTouchDevice) {
    touchEl.classList.toggle('active', gameState === 'playing' || gameState === 'levelup');
  }

  updateEffects(dt);

  if (gameState === 'classselect') return;

  if (gameState === 'levelup') {
    levelUpTimer--;
    if (levelUpTimer <= 0) gameState = 'playing';
  }
  if (gameState === 'nextmap') {
    nextMapTimer--;
    if (nextMapTimer <= 0) {
      const next = currentMapIdx + 1;
      if (next < MAPS.length) loadMap(next);
      else { loadMap(0); }
      gameState = 'playing';
    }
  }
  if (gameState === 'dead') return;

  updatePlayer(dt);
  updateEnemies(dt);
  updateDrops();
  updateProjectiles();
  updateParticles();
  updateCamera();
  autoPickup();
}

function updatePlayer(dt) {
  const spd = MOVE_SPEED + player.spd;
  let moving = false;

  if (keys['ArrowLeft'] || keys['KeyA']) {
    player.vx = -spd;
    player.dir = -1;
    moving = true;
  } else if (keys['ArrowRight'] || keys['KeyD']) {
    player.vx = spd;
    player.dir = 1;
    moving = true;
  } else {
    player.vx *= 0.7;
  }

  const wasOnGround = player.onGround;
  applyPhysics(player, keys['ArrowDown'] || keys['KeyS']);
  if (player.onGround && !wasOnGround) player.jumpsLeft = 2;
  if (!player.onGround && player.jumpsLeft === 2) player.jumpsLeft = 1;

  // Clamp to map
  player.x = Math.max(0, Math.min(map.width - player.w, player.x));

  // Timers
  if (player.attackTimer > 0) { player.attackTimer -= dt; if (player.attackTimer <= 0) player.attacking = false; }
  if (player.attackCooldown > 0) player.attackCooldown -= dt;
  if (player.invincible > 0) player.invincible -= dt;
  if (player.buffTimer > 0) {
    player.buffTimer -= dt;
    if (Math.random() < 0.25) spawnParticles(player.x + player.w / 2, player.y + 30, '#ff4040', 1);
  }
  for (const s of player.skills) if (s.cooldown > 0) s.cooldown -= dt;

  // Animation
  player.animTimer += dt;
  if (player.animTimer > 150) { player.animFrame = (player.animFrame + 1) % 4; player.animTimer = 0; }
  player.state = !player.onGround ? 'jump' : (moving ? 'walk' : 'idle');

  // MP regen
  if (Math.random() < 0.01) player.mp = Math.min(player.maxMp, player.mp + 1);

  // Portal check
  const portal = map.portal;
  if (portal && rectsOverlap(player.x, player.y, player.w, player.h, portal.x, portal.y, 30, 60)) {
    gameState = 'nextmap';
    nextMapTimer = 80;
  }
}

function updateEnemies(dt) {
  for (const e of enemies) {
    if (!e.alive) continue;
    if (e.hitFlash > 0) e.hitFlash--;
    if (e.attackCooldown > 0) e.attackCooldown -= dt;

    e.animTimer = (e.animTimer || 0) + dt;
    if (e.animTimer > 200) { e.animFrame = (e.animFrame + 1) % 4; e.animTimer = 0; }

    // Patrol AI
    e.patrolTimer += dt;
    if (e.patrolTimer > 1000 + Math.random() * 500) {
      e.vx = -e.vx;
      e.dir = e.vx > 0 ? 1 : -1;
      e.patrolTimer = 0;
    }

    // Chase player if nearby
    const distX = player.x - e.x;
    const distY = player.y - e.y;
    const dist = Math.hypot(distX, distY);
    if (dist < 250) {
      const chaseSpd = 1.2 + currentMapIdx * 0.3;
      e.vx = distX > 0 ? chaseSpd : -chaseSpd;
      e.dir = e.vx > 0 ? 1 : -1;
    }

    // Clamp patrol
    if (e.x < e.spawnX - e.patrolRange) e.vx = Math.abs(e.vx);
    if (e.x > e.spawnX + e.patrolRange) e.vx = -Math.abs(e.vx);

    applyPhysics(e);

    // Attack player on contact
    if (e.attackCooldown <= 0 && player.invincible <= 0 &&
        rectsOverlap(e.x - 5, e.y - 5, e.w + 10, e.h + 10, player.x, player.y, player.w, player.h)) {
      const dmg = e.atk;
      player.hp -= dmg;
      player.invincible = 800;
      spawnDamageNumber(player.x + player.w / 2, player.y - 10, dmg, '#FF4466');
      e.attackCooldown = 1200;
      if (player.hp <= 0) {
        player.hp = 0;
        gameState = 'dead';
      }
    }
  }
}

function updateDrops() {
  for (let i = drops.length - 1; i >= 0; i--) {
    const d = drops[i];
    d.vy += 0.4;
    d.y += d.vy;
    d.x += d.vx;
    d.vx *= 0.92;
    if (d.y > map.ground - 12) { d.y = map.ground - 12; d.vy *= -0.3; }
    d.life--;
    d.glowPhase += 0.1;
    if (d.life <= 0) drops.splice(i, 1);
  }
}

function updateProjectiles() {
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life--;
    let hit = false;
    for (const e of enemies) {
      if (!e.alive) continue;
      if (rectsOverlap(p.x - 6, p.y - 6, 12, 12, e.x, e.y, e.w, e.h)) {
        hitEnemy(e, p.dmg, p.color);
        hit = true;
        break;
      }
    }
    if (hit || p.life <= 0) projectiles.splice(i, 1);
  }
}

function updateEffects(dt) {
  for (let i = effects.length - 1; i >= 0; i--) {
    const f = effects[i];
    f.life--;
    if (f.fall) { f.y += f.vy; f.vy += 0.6; }
    if (f.life <= 0) effects.splice(i, 1);
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx || 0;
    p.y += (p.vy || 0);
    if (p.type !== 'text') p.vy = (p.vy || 0) + 0.1;
    p.life -= p.decay || 0.03;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function updateCamera() {
  const targetX = player.x + player.w / 2 - W / 2;
  camera.x += (targetX - camera.x) * 0.1;
  camera.x = Math.max(0, Math.min(map.width - W, camera.x));
}

function autoPickup() {
  for (let i = drops.length - 1; i >= 0; i--) {
    const d = drops[i];
    if (d.vy !== 0 && Math.abs(d.vy) > 0.5) continue;
    const dist = Math.hypot(d.x - (player.x + player.w / 2), d.y - (player.y + player.h));
    if (dist < 35) {
      applyItem(d);
      drops.splice(i, 1);
    }
  }
}

// ─── Draw ─────────────────────────────────────────────────────────────────────
function draw() {
  ctx.save();

  // Background gradient
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, map.bgColors[0]);
  grad.addColorStop(1, map.bgColors[1]);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Parallax BG elements
  drawBackground();

  ctx.translate(-camera.x, 0);

  // Ground
  ctx.fillStyle = '#5a8a3a';
  ctx.fillRect(0, map.ground, map.width, H - map.ground);
  ctx.fillStyle = '#3a6a2a';
  ctx.fillRect(0, map.ground + 15, map.width, H - map.ground - 15);

  // Ground top stripe
  ctx.fillStyle = '#7ab84a';
  ctx.fillRect(0, map.ground - 4, map.width, 8);

  // Platforms
  for (const p of map.platforms) {
    drawPlatform(p);
  }

  // Portal
  drawPortal();

  // Drops
  for (const d of drops) drawDrop(d);

  // Enemies
  for (const e of enemies) if (e.alive) drawEnemy(e);

  // Projectiles
  for (const p of projectiles) drawProjectile(p);

  // Skill effects (slashes, thunder, rain, buff rings)
  drawEffects();

  // Player
  drawPlayer();

  // Particles
  drawParticles();

  ctx.restore();

  // HUD (fixed position)
  drawHUD();
  drawSkillBar();
  if (gameState === 'classselect') { drawClassSelect(); return; }
  if (gameState === 'dead') drawDeadScreen();
  if (gameState === 'levelup') drawLevelUp();
  if (gameState === 'nextmap') drawNextMap();
}

function drawProjectile(p) {
  ctx.save();
  ctx.shadowBlur = 12;
  ctx.shadowColor = p.color;
  if (p.fx === 'arrow') {
    ctx.strokeStyle = p.color;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(p.x - p.dir * 12, p.y);
    ctx.lineTo(p.x + p.dir * 8, p.y);
    ctx.stroke();
    // arrowhead
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.moveTo(p.x + p.dir * 12, p.y);
    ctx.lineTo(p.x + p.dir * 4, p.y - 4);
    ctx.lineTo(p.x + p.dir * 4, p.y + 4);
    ctx.fill();
  } else if (p.fx === 'claw') {
    ctx.fillStyle = p.color;
    for (let k = 0; k < 3; k++) {
      ctx.globalAlpha = 0.8 - k * 0.2;
      ctx.fillRect(p.x - p.dir * k * 6 - 3, p.y - 2, 5, 4);
    }
  } else {
    // bolt / generic orb with core
    const r = 6 + Math.sin(Date.now() / 60) * 1;
    ctx.fillStyle = p.color;
    ctx.globalAlpha = 0.9;
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.globalAlpha = 0.8;
    ctx.beginPath(); ctx.arc(p.x, p.y, r * 0.45, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function drawEffects() {
  for (const f of effects) {
    const t = 1 - f.life / f.maxLife; // 0→1 progress
    ctx.save();
    if (f.type === 'slash' || f.type === 'cleave') {
      // Sweeping crescent arc in front of the player
      const reach = f.range || ATTACK_RANGE;
      const ox = f.x, oy = f.y + 21;
      const big = f.type === 'cleave';
      ctx.globalAlpha = 0.85 * (1 - t);
      ctx.strokeStyle = f.color;
      ctx.lineWidth = big ? 8 : 5;
      ctx.shadowBlur = 12; ctx.shadowColor = f.color;
      ctx.beginPath();
      const a0 = -1.1, a1 = 1.1;
      ctx.arc(ox, oy, reach * (0.6 + 0.4 * t), f.dir > 0 ? a0 : Math.PI - a0, f.dir > 0 ? a1 : Math.PI - a1, f.dir < 0);
      ctx.stroke();
      ctx.globalAlpha = 0.5 * (1 - t);
      ctx.lineWidth = big ? 3 : 2;
      ctx.strokeStyle = '#fff';
      ctx.stroke();
    } else if (f.type === 'thunder') {
      // Jagged lightning bolts striking down around the player
      ctx.globalAlpha = 1 - t;
      ctx.strokeStyle = f.color;
      ctx.lineWidth = 3;
      ctx.shadowBlur = 16; ctx.shadowColor = f.color;
      for (let b = 0; b < 5; b++) {
        const bx = f.x + (b - 2) * (f.r / 2.5);
        ctx.beginPath();
        ctx.moveTo(bx, f.y - 120);
        let yy = f.y - 120, xx = bx;
        while (yy < f.y + 60) { yy += 18; xx += (Math.random() - 0.5) * 22; ctx.lineTo(xx, yy); }
        ctx.stroke();
      }
      ctx.globalAlpha = 0.25 * (1 - t);
      ctx.fillStyle = f.color;
      ctx.fillRect(f.x - f.r, f.y - 130, f.r * 2, 200);
    } else if (f.type === 'rain') {
      // Volley of arrows raining down
      ctx.globalAlpha = 1 - t * 0.7;
      ctx.strokeStyle = f.color;
      ctx.lineWidth = 2;
      ctx.shadowBlur = 6; ctx.shadowColor = f.color;
      for (let a = 0; a < 14; a++) {
        const ax = f.x - f.r + (a / 13) * f.r * 2;
        const ay = f.y - 120 + ((t * 200 + a * 30) % 200);
        ctx.beginPath();
        ctx.moveTo(ax, ay);
        ctx.lineTo(ax - 4, ay - 12);
        ctx.stroke();
      }
    } else if (f.type === 'buff') {
      // Expanding power ring
      ctx.globalAlpha = 1 - t;
      ctx.strokeStyle = f.color;
      ctx.lineWidth = 4;
      ctx.shadowBlur = 14; ctx.shadowColor = f.color;
      ctx.beginPath();
      ctx.arc(f.x, f.y, 10 + t * 36, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();
  }
}

function drawBackground() {
  const parallax = camera.x * 0.3;
  for (const t of map.trees) {
    const sx = (t.x - parallax) % (map.width + W);
    if (sx < -80 || sx > W + 80) continue;
    if (t.isRock) {
      // Rocky mountain scenery
      ctx.fillStyle = '#776655';
      ctx.beginPath();
      ctx.moveTo(sx, H - 120);
      ctx.lineTo(sx + 50, H - 220);
      ctx.lineTo(sx + 100, H - 120);
      ctx.fill();
      ctx.fillStyle = '#998877';
      ctx.beginPath();
      ctx.moveTo(sx + 20, H - 120);
      ctx.lineTo(sx + 60, H - 190);
      ctx.lineTo(sx + 90, H - 120);
      ctx.fill();
    } else if (t.isGlow) {
      // Magic glowing trees
      ctx.save();
      ctx.shadowBlur = 20;
      ctx.shadowColor = '#9933ff';
      ctx.fillStyle = '#4a1a7a';
      ctx.fillRect(sx + 22, H - 200, 16, 120);
      ctx.fillStyle = '#7733cc';
      ctx.beginPath();
      ctx.arc(sx + 30, H - 210, 40, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    } else {
      // Normal trees
      ctx.fillStyle = '#5a3a1a';
      ctx.fillRect(sx + 22, H - 180, 16, 100);
      ctx.fillStyle = '#2d6a2d';
      ctx.beginPath();
      ctx.arc(sx + 30, H - 195, 38, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#3a8a3a';
      ctx.beginPath();
      ctx.arc(sx + 30, H - 215, 28, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function drawPlatform(p) {
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.fillRect(p.x + 4, p.y + 6, p.w, 10);
  // Base
  ctx.fillStyle = '#7a5a3a';
  ctx.fillRect(p.x, p.y + 4, p.w, 10);
  // Top surface
  ctx.fillStyle = '#9a7a4a';
  ctx.fillRect(p.x, p.y, p.w, 8);
  // Highlight
  ctx.fillStyle = '#bfa06a';
  ctx.fillRect(p.x + 2, p.y, p.w - 4, 3);
  // Edge details
  ctx.fillStyle = '#6a4a2a';
  ctx.fillRect(p.x, p.y, 4, 14);
  ctx.fillRect(p.x + p.w - 4, p.y, 4, 14);
}

function drawPortal() {
  const portal = map.portal;
  if (!portal) return;
  const t = Date.now() / 500;
  const glow = Math.sin(t) * 0.3 + 0.7;
  ctx.save();
  ctx.globalAlpha = glow;
  ctx.shadowBlur = 20;
  ctx.shadowColor = '#00FFFF';
  // Portal frame
  ctx.strokeStyle = '#00DDFF';
  ctx.lineWidth = 3;
  ctx.strokeRect(portal.x, portal.y, 30, 60);
  // Inner shimmer
  const pg = ctx.createLinearGradient(portal.x, portal.y, portal.x, portal.y + 60);
  pg.addColorStop(0, 'rgba(0,200,255,0.6)');
  pg.addColorStop(0.5, 'rgba(0,100,200,0.3)');
  pg.addColorStop(1, 'rgba(0,200,255,0.6)');
  ctx.fillStyle = pg;
  ctx.fillRect(portal.x + 3, portal.y + 3, 24, 54);
  // Label
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#00FFFF';
  ctx.font = '10px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('NEXT', portal.x + 15, portal.y - 6);
  ctx.restore();
}

function drawPlayer() {
  const px = player.x, py = player.y, d = player.dir;
  const blink = player.invincible > 0 && Math.floor(Date.now() / 80) % 2 === 0;
  if (blink) return;
  const c = player.cls;
  const skin = '#ffdfc4';
  const atk = player.attacking;

  ctx.save();
  if (d < 0) {
    ctx.translate(px + player.w / 2, 0);
    ctx.scale(-1, 1);
    ctx.translate(-(px + player.w / 2), 0);
  }

  const walk = player.state === 'walk';
  const f = player.animFrame;
  const legOff = walk ? Math.sin(f * Math.PI / 2) * 4 : 0;

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.28)';
  ctx.beginPath();
  ctx.ellipse(px + 15, map.ground + 2, 15, 4, 0, 0, Math.PI * 2);
  ctx.fill();

  // Rage aura
  if (player.buffTimer > 0) {
    ctx.save();
    ctx.globalAlpha = 0.3 + Math.sin(Date.now() / 100) * 0.15;
    ctx.shadowBlur = 16; ctx.shadowColor = '#ff3030';
    ctx.fillStyle = 'rgba(255,60,40,0.25)';
    ctx.beginPath();
    ctx.ellipse(px + 15, py + 24, 21, 27, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // Legs
  ctx.fillStyle = '#3a3550';
  ctx.fillRect(px + 8, py + 33, 6, 7 + legOff);
  ctx.fillRect(px + 16, py + 33, 6, 7 - legOff);
  // Shoes
  ctx.fillStyle = '#7a4420';
  ctx.fillRect(px + 7, py + 39 + legOff, 8, 3);
  ctx.fillRect(px + 15, py + 39 - legOff, 8, 3);

  // Back arm
  ctx.fillStyle = skin;
  ctx.fillRect(px + 5, py + 23, 5, 9);

  // Body / robe
  ctx.fillStyle = c.color;
  if (c.id === 'magician') {
    ctx.beginPath();
    ctx.moveTo(px + 8, py + 22);
    ctx.lineTo(px + 22, py + 22);
    ctx.lineTo(px + 25, py + 35);
    ctx.lineTo(px + 5, py + 35);
    ctx.closePath();
    ctx.fill();
  } else {
    ctx.fillRect(px + 8, py + 22, 14, 12);
    if (c.id === 'warrior') {
      ctx.fillStyle = shadeColor(c.color, 25);
      ctx.fillRect(px + 6, py + 22, 4, 5);
      ctx.fillRect(px + 20, py + 22, 4, 5);
    }
  }
  // Trim + belt
  ctx.fillStyle = c.trim;
  ctx.fillRect(px + 14, py + 22, 2, 12);
  ctx.fillStyle = '#5a3a1a';
  ctx.fillRect(px + 8, py + 31, 14, 2);

  // Head
  ctx.fillStyle = skin;
  ctx.fillRect(px + 6, py + 4, 18, 17);
  ctx.fillRect(px + 5, py + 12, 2, 4); // ear
  // Eyes (big MapleStory eyes)
  ctx.fillStyle = '#fff';
  ctx.fillRect(px + 11, py + 10, 3, 5);
  ctx.fillRect(px + 18, py + 10, 3, 5);
  ctx.fillStyle = '#3a2a4a';
  ctx.fillRect(px + 12, py + 11, 2, 4);
  ctx.fillRect(px + 19, py + 11, 2, 4);
  ctx.fillStyle = '#c06050';
  ctx.fillRect(px + 14, py + 17, 4, 1);

  // Hair base
  ctx.fillStyle = c.hair;
  ctx.fillRect(px + 5, py + 2, 20, 6);
  ctx.fillRect(px + 5, py + 4, 4, 8);

  // Class headgear
  if (c.id === 'warrior') {
    ctx.fillStyle = '#b8b8c0';
    ctx.fillRect(px + 5, py, 20, 7);
    ctx.fillStyle = c.trim;
    ctx.fillRect(px + 5, py + 6, 20, 2);
    ctx.fillStyle = '#d04040';
    ctx.fillRect(px + 13, py - 4, 4, 6);
  } else if (c.id === 'magician') {
    ctx.fillStyle = c.color;
    ctx.beginPath();
    ctx.moveTo(px + 3, py + 4);
    ctx.lineTo(px + 27, py + 4);
    ctx.lineTo(px + 17, py - 12);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = c.trim;
    ctx.fillRect(px + 3, py + 3, 24, 3);
    ctx.fillStyle = '#ffe84a';
    ctx.fillRect(px + 14, py - 6, 3, 3);
  } else {
    ctx.fillStyle = c.color;
    ctx.fillRect(px + 5, py, 20, 6);
    ctx.fillStyle = c.trim;
    ctx.fillRect(px + 5, py + 5, 20, 2);
    ctx.fillStyle = '#e0e060';
    ctx.beginPath();
    ctx.moveTo(px + 22, py + 1);
    ctx.lineTo(px + 34, py - 6);
    ctx.lineTo(px + 24, py + 4);
    ctx.closePath();
    ctx.fill();
  }

  // Front arm + weapon
  drawWeapon(px, py, c, atk, skin);

  ctx.restore();
}

function drawWeapon(px, py, c, atk, skin) {
  const armY = py + 23;
  if (c.weapon === 'sword') {
    if (atk) {
      ctx.fillStyle = skin;
      ctx.fillRect(px + 22, py + 20, 12, 5);
      ctx.save();
      ctx.translate(px + 32, py + 14);
      ctx.fillStyle = '#dfe6ef';
      ctx.fillRect(0, -2, 22, 5);
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, -2, 22, 2);
      ctx.fillStyle = c.trim;
      ctx.fillRect(-4, -4, 4, 9);
      ctx.fillStyle = '#5a3a1a';
      ctx.fillRect(-8, -2, 5, 5);
      ctx.restore();
    } else {
      ctx.fillStyle = skin;
      ctx.fillRect(px + 21, armY, 6, 9);
      ctx.fillStyle = '#dfe6ef';
      ctx.fillRect(px + 24, py + 4, 4, 22);
      ctx.fillStyle = c.trim;
      ctx.fillRect(px + 22, py + 24, 8, 3);
    }
  } else if (c.weapon === 'staff') {
    ctx.fillStyle = skin;
    ctx.fillRect(px + 21, armY, 6, 9);
    ctx.fillStyle = '#7a5a2a';
    ctx.fillRect(px + 25, py + 2, 3, 30);
    const t = Date.now() / 200;
    ctx.save();
    ctx.shadowBlur = 10; ctx.shadowColor = c.trim;
    ctx.fillStyle = c.trim;
    ctx.beginPath();
    ctx.arc(px + 26, py + 1, 4 + Math.sin(t) * 0.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    if (atk) { ctx.fillStyle = skin; ctx.fillRect(px + 24, py + 21, 10, 5); }
  } else { // bow
    ctx.fillStyle = skin;
    ctx.fillRect(px + 21, armY, 6, 9);
    ctx.strokeStyle = '#8a5a2a';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(px + 30, py + 18, 13, -Math.PI / 2.2, Math.PI / 2.2);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.6)';
    ctx.lineWidth = 1;
    const a1 = -Math.PI / 2.2, a2 = Math.PI / 2.2;
    ctx.beginPath();
    ctx.moveTo(px + 30 + 13 * Math.cos(a1), py + 18 + 13 * Math.sin(a1));
    ctx.lineTo(px + 30 + 13 * Math.cos(a2), py + 18 + 13 * Math.sin(a2));
    ctx.stroke();
    if (atk) { ctx.fillStyle = skin; ctx.fillRect(px + 22, py + 20, 10, 5); }
  }
}

function drawEnemy(e) {
  const blink = e.hitFlash > 0 && Math.floor(Date.now() / 60) % 2 === 0;
  const alpha = blink ? 0.4 : 1;
  ctx.save();
  ctx.globalAlpha = alpha;

  const anim = e.animFrame;
  const legOff = Math.sin(anim * Math.PI / 2) * 3;

  if (e.dir < 0) {
    ctx.translate(e.x + e.w / 2, e.y);
    ctx.scale(-1, 1);
    ctx.translate(-(e.x + e.w / 2), -e.y);
  }

  // Shadow
  ctx.globalAlpha = alpha * 0.3;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(e.x + e.w / 2, map.ground + 2, 14, 4, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = alpha;

  // Body (distinct per enemy type)
  const baseColor = e.color;
  const darkColor = shadeColor(baseColor, -35);
  const liteColor = shadeColor(baseColor, 30);
  const n = e.name;
  const ex = e.x, ey = e.y, cx = e.x + e.w / 2;

  function eyes(lx, rx, yy, sz) {
    ctx.fillStyle = '#fff';
    ctx.fillRect(ex + lx, ey + yy, sz, sz + 1);
    ctx.fillRect(ex + rx, ey + yy, sz, sz + 1);
    ctx.fillStyle = '#000';
    ctx.fillRect(ex + lx + 1, ey + yy + 1, 2, 3);
    ctx.fillRect(ex + rx + 1, ey + yy + 1, 2, 3);
  }

  if (n.includes('Snail')) {
    // Foot
    ctx.fillStyle = '#f0e0b0';
    ctx.fillRect(ex + 2, ey + 24, 30, 10 + legOff);
    ctx.fillRect(ex, ey + 28, 4, 4); // tail
    // Shell
    ctx.fillStyle = baseColor;
    ctx.beginPath(); ctx.arc(ex + 22, ey + 18, 13, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = darkColor;
    ctx.beginPath(); ctx.arc(ex + 24, ey + 19, 8, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = liteColor;
    ctx.beginPath(); ctx.arc(ex + 26, ey + 20, 3, 0, Math.PI * 2); ctx.fill();
    // Head + eyestalks
    ctx.fillStyle = '#f0e0b0';
    ctx.fillRect(ex + 2, ey + 20, 10, 12);
    ctx.fillRect(ex + 3, ey + 14, 2, 7);
    ctx.fillRect(ex + 9, ey + 14, 2, 7);
    ctx.fillStyle = '#000';
    ctx.fillRect(ex + 2, ey + 12, 4, 4);
    ctx.fillRect(ex + 8, ey + 12, 4, 4);
  } else if (n.includes('Mushroom') || n.includes('Shroom')) {
    const zombie = n.includes('Zombie');
    // Stem
    ctx.fillStyle = zombie ? '#cfe0c0' : '#f2e2c2';
    ctx.fillRect(ex + 9, ey + 18, 18, 18);
    // Cap
    ctx.fillStyle = baseColor;
    ctx.beginPath(); ctx.arc(cx, ey + 18, 18, Math.PI, 0); ctx.fill();
    ctx.fillRect(ex + 0, ey + 16, 36, 4);
    // Spots
    ctx.fillStyle = zombie ? '#2a3a2a' : '#fff';
    ctx.fillRect(ex + 6, ey + 8, 5, 5);
    ctx.fillRect(ex + 16, ey + 4, 6, 6);
    ctx.fillRect(ex + 26, ey + 9, 5, 5);
    // Face
    eyes(10, 22, 22, 4);
    ctx.fillStyle = zombie ? '#702020' : '#a05030';
    ctx.fillRect(ex + 15, ey + 30, 6, 2);
    if (zombie) { ctx.fillStyle = '#3a5a3a'; ctx.fillRect(ex + 12, ey + 33, 3, 4); ctx.fillRect(ex + 21, ey + 33, 3, 4); }
  } else if (n.includes('Slime')) {
    ctx.fillStyle = baseColor;
    ctx.beginPath(); ctx.ellipse(cx, ey + 22, 17, 15 + legOff, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = liteColor;
    ctx.beginPath(); ctx.ellipse(cx - 4, ey + 16, 5, 6, 0, 0, Math.PI * 2); ctx.fill();
    eyes(9, 21, 16, 5);
    ctx.fillStyle = '#000';
    ctx.fillRect(ex + 13, ey + 26, 10, 2);
  } else if (n.includes('Boar') || n.includes('Pig')) {
    const fire = n.includes('Fire');
    // Body
    ctx.fillStyle = baseColor;
    ctx.beginPath(); ctx.ellipse(cx, ey + 22, 17, 12, 0, 0, Math.PI * 2); ctx.fill();
    // Snout
    ctx.fillStyle = liteColor;
    ctx.fillRect(ex + 26, ey + 18, 9, 8);
    ctx.fillStyle = darkColor;
    ctx.fillRect(ex + 28, ey + 20, 2, 4);
    ctx.fillRect(ex + 32, ey + 20, 2, 4);
    // Ear
    ctx.fillStyle = baseColor;
    ctx.beginPath(); ctx.moveTo(ex + 18, ey + 10); ctx.lineTo(ex + 24, ey + 16); ctx.lineTo(ex + 14, ey + 16); ctx.fill();
    // Eye
    ctx.fillStyle = '#fff'; ctx.fillRect(ex + 22, ey + 14, 4, 4);
    ctx.fillStyle = '#000'; ctx.fillRect(ex + 23, ey + 15, 2, 2);
    // Tusk
    ctx.fillStyle = '#fff'; ctx.fillRect(ex + 27, ey + 25, 4, 2);
    // Legs
    ctx.fillStyle = darkColor;
    ctx.fillRect(ex + 8, ey + 30 + legOff, 5, 7);
    ctx.fillRect(ex + 22, ey + 30 - legOff, 5, 7);
    if (fire) { // flame mane
      ctx.fillStyle = 'rgba(255,140,40,0.8)';
      for (let i = 0; i < 4; i++) ctx.fillRect(ex + 4 + i * 6, ey + 8 - (i % 2) * 3, 4, 8);
    }
  } else if (n.includes('Stump')) {
    const dark = n.includes('Dark');
    // Trunk
    ctx.fillStyle = baseColor;
    ctx.fillRect(ex + 6, ey + 12, 24, 24);
    ctx.fillStyle = darkColor;
    ctx.fillRect(ex + 6, ey + 12, 24, 4); // top rim
    // Rings
    ctx.fillStyle = liteColor;
    ctx.fillRect(ex + 12, ey + 13, 12, 2);
    // Bark lines
    ctx.fillStyle = darkColor;
    ctx.fillRect(ex + 12, ey + 18, 2, 16);
    ctx.fillRect(ex + 22, ey + 18, 2, 16);
    // Angry face
    ctx.fillStyle = '#000';
    ctx.fillRect(ex + 11, ey + 22, 4, 3);
    ctx.fillRect(ex + 21, ey + 22, 4, 3);
    ctx.fillRect(ex + 13, ey + 29, 10, 2);
    if (!dark) { // little legs
      ctx.fillStyle = darkColor;
      ctx.fillRect(ex + 9, ey + 35 + legOff, 5, 5);
      ctx.fillRect(ex + 22, ey + 35 - legOff, 5, 5);
    } else { // axe
      ctx.fillStyle = '#aaa'; ctx.fillRect(ex + 28, ey + 6, 8, 4);
      ctx.fillStyle = '#7a5a2a'; ctx.fillRect(ex + 30, ey + 8, 2, 14);
    }
  } else if (n.includes('Eye')) {
    const curse = n.includes('Curse');
    // Floating body
    ctx.fillStyle = baseColor;
    ctx.beginPath(); ctx.ellipse(cx, ey + 20 + Math.sin(Date.now() / 300) * 2, 15, 16, 0, 0, Math.PI * 2); ctx.fill();
    // Big eye
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(cx, ey + 20, 9, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = curse ? '#cc2020' : '#9020c0';
    ctx.beginPath(); ctx.arc(cx + e.dir * 2, ey + 20, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(cx + e.dir * 2, ey + 20, 2, 0, Math.PI * 2); ctx.fill();
    // Tendrils
    ctx.strokeStyle = darkColor; ctx.lineWidth = 2;
    for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.moveTo(cx + i * 8, ey + 33); ctx.lineTo(cx + i * 10, ey + 38); ctx.stroke(); }
  } else if (n.includes('Necki')) {
    // Snake
    ctx.fillStyle = baseColor;
    ctx.fillRect(ex + 6, ey + 22, 24, 14); // coil base
    ctx.beginPath(); ctx.arc(ex + 24, ey + 14, 10, 0, Math.PI * 2); ctx.fill(); // head
    ctx.fillStyle = liteColor;
    ctx.fillRect(ex + 8, ey + 26, 20, 3);
    ctx.fillStyle = '#fff'; ctx.fillRect(ex + 24, ey + 11, 4, 4);
    ctx.fillStyle = '#000'; ctx.fillRect(ex + 25, ey + 12, 2, 2);
    ctx.fillStyle = '#c02020'; ctx.fillRect(ex + 30, ey + 16, 5, 2); // tongue
  } else if (n.includes('Golem')) {
    ctx.fillStyle = baseColor;
    ctx.fillRect(ex + 4, ey + 8, 28, 28);
    ctx.fillStyle = darkColor;
    ctx.fillRect(ex + 4, ey + 8, 28, 3);
    ctx.fillRect(ex + 16, ey + 8, 3, 28);
    ctx.fillRect(ex + 4, ey + 22, 28, 3);
    ctx.fillStyle = liteColor; ctx.fillRect(ex + 7, ey + 11, 6, 6);
    eyes(9, 21, 14, 5);
    ctx.fillStyle = darkColor;
    ctx.fillRect(ex + 0, ey + 14, 6, 12); // arms
    ctx.fillRect(ex + 30, ey + 14, 6, 12);
  } else if (n.includes('Wraith') || n.includes('Balrog')) {
    const balrog = n.includes('Balrog');
    // Ghostly cloak
    ctx.globalAlpha = alpha * (balrog ? 1 : 0.85);
    ctx.fillStyle = baseColor;
    ctx.beginPath();
    ctx.moveTo(ex + 4, ey + 8);
    ctx.lineTo(ex + 32, ey + 8);
    ctx.lineTo(ex + 30, ey + 36);
    ctx.lineTo(ex + 24, ey + 30);
    ctx.lineTo(ex + 18, ey + 36);
    ctx.lineTo(ex + 12, ey + 30);
    ctx.lineTo(ex + 6, ey + 36);
    ctx.closePath(); ctx.fill();
    // Hood face
    ctx.fillStyle = '#000';
    ctx.fillRect(ex + 10, ey + 10, 16, 12);
    ctx.fillStyle = balrog ? '#ff3020' : '#90e0ff';
    ctx.fillRect(ex + 13, ey + 14, 4, 4);
    ctx.fillRect(ex + 19, ey + 14, 4, 4);
    ctx.globalAlpha = alpha;
    if (balrog) { // horns
      ctx.fillStyle = '#1a1a1a';
      ctx.beginPath(); ctx.moveTo(ex + 6, ey + 8); ctx.lineTo(ex + 2, ey - 4); ctx.lineTo(ex + 12, ey + 6); ctx.fill();
      ctx.beginPath(); ctx.moveTo(ex + 30, ey + 8); ctx.lineTo(ex + 34, ey - 4); ctx.lineTo(ex + 24, ey + 6); ctx.fill();
    }
  } else {
    // Generic critter
    ctx.fillStyle = baseColor;
    ctx.fillRect(ex + 4, ey + 8, 28, 24);
    eyes(9, 21, 14, 5);
    ctx.fillStyle = darkColor;
    ctx.fillRect(ex + 6, ey + 30 + legOff, 8, 7);
    ctx.fillRect(ex + 22, ey + 30 - legOff, 8, 7);
  }

  ctx.restore();

  // HP bar above enemy
  const barW = e.w + 10;
  const barX = e.x - 5;
  const barY = e.y - 14;
  ctx.fillStyle = '#330000';
  ctx.fillRect(barX, barY, barW, 6);
  ctx.fillStyle = '#ff3333';
  ctx.fillRect(barX, barY, barW * (e.hp / e.maxHp), 6);
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 0.5;
  ctx.strokeRect(barX, barY, barW, 6);

  // Name
  ctx.fillStyle = '#fff';
  ctx.font = '9px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(e.name, e.x + e.w / 2, e.y - 16);
}

function drawDrop(d) {
  const pulse = Math.sin(d.glowPhase) * 0.3 + 0.7;
  ctx.save();
  ctx.globalAlpha = Math.min(d.life / 60, 1) * pulse;
  ctx.shadowBlur = 8;
  ctx.shadowColor = d.color;
  ctx.fillStyle = d.color;
  if (d.isMeso) {
    ctx.beginPath();
    ctx.arc(d.x, d.y, 6, 0, Math.PI * 2);
    ctx.fill();
  } else {
    ctx.fillRect(d.x - 7, d.y - 7, 14, 14);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;
    ctx.strokeRect(d.x - 7, d.y - 7, 14, 14);
  }
  ctx.restore();
  // Label
  ctx.save();
  ctx.globalAlpha = Math.min(d.life / 60, 1);
  ctx.fillStyle = '#fff';
  ctx.font = '8px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(d.isMeso ? `${d.value}` : d.name, d.x, d.y - 12);
  ctx.restore();
}

function drawParticles() {
  for (const p of particles) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.life);
    if (p.type === 'text') {
      ctx.fillStyle = p.color;
      ctx.font = 'bold 14px monospace';
      ctx.textAlign = 'center';
      ctx.shadowBlur = 6;
      ctx.shadowColor = p.color;
      ctx.fillText(p.text, p.x, p.y);
    } else {
      ctx.fillStyle = p.color;
      ctx.shadowBlur = 4;
      ctx.shadowColor = p.color;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    ctx.restore();
  }
}

function drawHUD() {
  // Background panel
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  roundRect(ctx, 8, 8, 250, 80, 8);
  ctx.fill();
  ctx.strokeStyle = '#4a2a7a';
  ctx.lineWidth = 1.5;
  roundRect(ctx, 8, 8, 250, 80, 8);
  ctx.stroke();

  // Character name & level
  ctx.fillStyle = '#FFD700';
  ctx.font = 'bold 14px monospace';
  ctx.textAlign = 'left';
  ctx.fillText(`Lv.${player.level} ${player.cls.name}`, 18, 28);

  // HP bar
  const hpPct = player.hp / player.maxHp;
  ctx.fillStyle = '#330000';
  ctx.fillRect(18, 34, 200, 12);
  const hpGrad = ctx.createLinearGradient(18, 0, 218, 0);
  hpGrad.addColorStop(0, '#cc0000');
  hpGrad.addColorStop(1, '#ff4444');
  ctx.fillStyle = hpGrad;
  ctx.fillRect(18, 34, 200 * hpPct, 12);
  ctx.strokeStyle = '#440000';
  ctx.lineWidth = 1;
  ctx.strokeRect(18, 34, 200, 12);
  ctx.fillStyle = '#fff';
  ctx.font = '9px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(`HP ${player.hp}/${player.maxHp}`, 118, 44);

  // MP bar
  const mpPct = player.mp / player.maxMp;
  ctx.fillStyle = '#000033';
  ctx.fillRect(18, 50, 200, 10);
  const mpGrad = ctx.createLinearGradient(18, 0, 218, 0);
  mpGrad.addColorStop(0, '#0000cc');
  mpGrad.addColorStop(1, '#4444ff');
  ctx.fillStyle = mpGrad;
  ctx.fillRect(18, 50, 200 * mpPct, 10);
  ctx.strokeStyle = '#000044';
  ctx.strokeRect(18, 50, 200, 10);
  ctx.fillStyle = '#aaf';
  ctx.font = '9px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(`MP ${player.mp}/${player.maxMp}`, 118, 58);

  // EXP bar
  const expPct = player.exp / player.expNeeded;
  ctx.fillStyle = '#111100';
  ctx.fillRect(18, 64, 200, 8);
  ctx.fillStyle = '#aacc00';
  ctx.fillRect(18, 64, 200 * expPct, 8);
  ctx.strokeStyle = '#334400';
  ctx.strokeRect(18, 64, 200, 8);
  ctx.fillStyle = '#ccff44';
  ctx.font = '8px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(`EXP ${player.exp}/${player.expNeeded}`, 118, 71);

  // Stats panel (top right)
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  roundRect(ctx, W - 170, 8, 162, 70, 8);
  ctx.fill();
  ctx.strokeStyle = '#4a2a7a';
  roundRect(ctx, W - 170, 8, 162, 70, 8);
  ctx.stroke();

  ctx.fillStyle = '#FFD700';
  ctx.font = '11px monospace';
  ctx.textAlign = 'left';
  ctx.fillText(`ATK: ${player.atk}`, W - 160, 26);
  ctx.fillText(`SPD: +${player.spd}`, W - 160, 40);
  ctx.fillStyle = '#FFD700';
  ctx.fillText(`Meso: ${player.meso}`, W - 160, 54);
  ctx.fillStyle = '#aaa';
  ctx.fillText(`Kills: ${totalMobsKilled}`, W - 160, 68);

  // Map name (top center)
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  const mapNameW = ctx.measureText(map.name).width + 20;
  roundRect(ctx, W / 2 - mapNameW / 2, 8, mapNameW, 24, 6);
  ctx.fill();
  ctx.fillStyle = '#88ddff';
  ctx.font = '12px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(map.name, W / 2, 24);

  // Controls reminder (bottom)
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(0, H - 24, W, 24);
  ctx.fillStyle = '#888';
  ctx.font = '10px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('←→ Move  ↑/Space Jump (×2)  Z Attack  Q/E/R ' + player.cls.name + ' skills  F Pickup  ↓ Drop', W / 2, H - 8);
}

function drawSkillBar() {
  const barY = H - 55;
  const startX = W / 2 - (player.skills.length * 55) / 2;
  for (let i = 0; i < player.skills.length; i++) {
    const s = player.skills[i];
    const sx = startX + i * 55;
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    roundRect(ctx, sx, barY, 48, 48, 6);
    ctx.fill();
    ctx.strokeStyle = s.cooldown > 0 ? '#333' : s.color;
    ctx.lineWidth = 2;
    roundRect(ctx, sx, barY, 48, 48);
    ctx.stroke();

    if (s.cooldown > 0) {
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      const cdH = 48 * (s.cooldown / s.maxCd);
      ctx.fillRect(sx + 2, barY + 48 - cdH, 44, cdH);
    }

    ctx.fillStyle = s.color;
    ctx.shadowBlur = s.cooldown > 0 ? 0 : 6;
    ctx.shadowColor = s.color;
    ctx.font = 'bold 10px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(s.name.split(' ')[0], sx + 24, barY + 22);
    ctx.fillStyle = '#fff';
    ctx.font = '9px monospace';
    ctx.fillText(`[${s.key.replace('Key', '')}]`, sx + 24, barY + 34);
    ctx.fillText(`${s.mpCost}mp`, sx + 24, barY + 44);
    ctx.shadowBlur = 0;
  }
}

function drawDeadScreen() {
  ctx.fillStyle = 'rgba(0,0,0,0.75)';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#FF2233';
  ctx.font = 'bold 48px monospace';
  ctx.textAlign = 'center';
  ctx.shadowBlur = 20;
  ctx.shadowColor = '#FF0000';
  ctx.fillText('YOU DIED', W / 2, H / 2 - 40);
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#aaa';
  ctx.font = '18px monospace';
  ctx.fillText('10% EXP & Meso lost', W / 2, H / 2);
  ctx.fillStyle = '#fff';
  ctx.font = '20px monospace';
  const blink = Math.floor(Date.now() / 500) % 2 === 0;
  if (blink) ctx.fillText('Press SPACE to respawn', W / 2, H / 2 + 40);
}

function drawLevelUp() {
  ctx.save();
  const alpha = Math.min(levelUpTimer / 30, 1);
  ctx.globalAlpha = alpha;
  ctx.fillStyle = '#FFD700';
  ctx.font = 'bold 42px monospace';
  ctx.textAlign = 'center';
  ctx.shadowBlur = 30;
  ctx.shadowColor = '#FFD700';
  ctx.fillText(`LEVEL UP! → ${player.level}`, W / 2, H / 2 - 60);
  ctx.font = '18px monospace';
  ctx.fillStyle = '#fff';
  const c = player.cls;
  ctx.fillText(`HP+${c.hpPerLv}  MP+${c.mpPerLv}  ATK+${c.atkPerLv}`, W / 2, H / 2 - 20);
  ctx.restore();
}

function drawClassSelect() {
  ctx.fillStyle = 'rgba(10,5,25,0.92)';
  ctx.fillRect(0, 0, W, H);

  // Title
  ctx.fillStyle = '#ffcf3a';
  ctx.font = 'bold 42px monospace';
  ctx.textAlign = 'center';
  ctx.shadowBlur = 18; ctx.shadowColor = '#ff9a1e';
  ctx.fillText('MapleStory', W / 2, 70);
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#9fd0ff';
  ctx.font = '16px monospace';
  ctx.fillText('Choose your job', W / 2, 100);

  const cardW = 250, gap = 30, cardH = 280, cardY = 150;
  const total = CLASSES.length * cardW + (CLASSES.length - 1) * gap;
  const startX = W / 2 - total / 2;

  for (let i = 0; i < CLASSES.length; i++) {
    const c = CLASSES[i];
    const x = startX + i * (cardW + gap);
    const sel = i === classHover;

    ctx.fillStyle = sel ? 'rgba(60,40,100,0.95)' : 'rgba(30,20,55,0.9)';
    roundRect(ctx, x, cardY, cardW, cardH, 12);
    ctx.fill();
    ctx.lineWidth = sel ? 4 : 2;
    ctx.strokeStyle = sel ? c.trim : '#4a2a7a';
    if (sel) { ctx.shadowBlur = 18; ctx.shadowColor = c.trim; }
    roundRect(ctx, x, cardY, cardW, cardH, 12);
    ctx.stroke();
    ctx.shadowBlur = 0;

    // Emblem figure
    drawClassEmblem(x + cardW / 2, cardY + 95, c);

    // Name
    ctx.fillStyle = c.trim;
    ctx.font = 'bold 24px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(c.name, x + cardW / 2, cardY + 150);

    // Stats
    ctx.font = '13px monospace';
    ctx.fillStyle = '#ddd';
    ctx.fillText(`HP ${c.maxHp}   MP ${c.maxMp}   ATK ${c.atk}`, x + cardW / 2, cardY + 176);
    ctx.fillStyle = '#aaa';
    ctx.font = '12px monospace';
    wrapText(c.blurb, x + cardW / 2, cardY + 200, cardW - 30, 16);

    // Skills
    ctx.fillStyle = c.trim;
    ctx.font = '11px monospace';
    for (let s = 0; s < c.skills.length; s++) {
      ctx.fillText(`[${c.skills[s].key.replace('Key', '')}] ${c.skills[s].name}`, x + cardW / 2, cardY + 234 + s * 15);
    }

    if (sel) {
      ctx.fillStyle = '#ffcf3a';
      ctx.font = 'bold 13px monospace';
      const pulse = Math.floor(Date.now() / 400) % 2 === 0;
      if (pulse) ctx.fillText('▶ TAP / PRESS Z ◀', x + cardW / 2, cardY + cardH - 8);
    }
  }

  ctx.fillStyle = '#888';
  ctx.font = '12px monospace';
  ctx.fillText(isTouchDevice ? 'Tap a card to highlight, tap again to start' : '◀ ▶ or 1/2/3 to choose   ·   Z / Space to start', W / 2, H - 24);
}

function drawClassEmblem(cx, cy, c) {
  // Mini chibi preview
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(cx, cy + 36, 22, 6, 0, 0, Math.PI * 2); ctx.fill();
  // body
  ctx.fillStyle = c.color;
  ctx.fillRect(cx - 14, cy + 4, 28, 24);
  ctx.fillStyle = c.trim;
  ctx.fillRect(cx - 3, cy + 4, 4, 24);
  // head
  ctx.fillStyle = '#ffdfc4';
  ctx.fillRect(cx - 16, cy - 28, 32, 30);
  ctx.fillStyle = '#fff';
  ctx.fillRect(cx - 9, cy - 16, 5, 8); ctx.fillRect(cx + 4, cy - 16, 5, 8);
  ctx.fillStyle = '#3a2a4a';
  ctx.fillRect(cx - 7, cy - 14, 3, 5); ctx.fillRect(cx + 6, cy - 14, 3, 5);
  // headgear
  ctx.fillStyle = c.hair;
  ctx.fillRect(cx - 16, cy - 30, 32, 8);
  if (c.id === 'warrior') {
    ctx.fillStyle = '#b8b8c0'; ctx.fillRect(cx - 16, cy - 32, 32, 8);
    ctx.fillStyle = '#d04040'; ctx.fillRect(cx - 3, cy - 40, 6, 9);
  } else if (c.id === 'magician') {
    ctx.fillStyle = c.color;
    ctx.beginPath(); ctx.moveTo(cx - 18, cy - 28); ctx.lineTo(cx + 18, cy - 28); ctx.lineTo(cx, cy - 52); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffe84a'; ctx.fillRect(cx - 2, cy - 44, 4, 4);
  } else {
    ctx.fillStyle = c.color; ctx.fillRect(cx - 16, cy - 32, 32, 8);
    ctx.fillStyle = '#e0e060';
    ctx.beginPath(); ctx.moveTo(cx + 12, cy - 30); ctx.lineTo(cx + 30, cy - 40); ctx.lineTo(cx + 14, cy - 24); ctx.fill();
  }
  // weapon hint
  ctx.fillStyle = '#dfe6ef';
  if (c.weapon === 'sword') ctx.fillRect(cx + 16, cy - 20, 5, 40);
  else if (c.weapon === 'staff') { ctx.fillStyle = '#7a5a2a'; ctx.fillRect(cx + 17, cy - 24, 4, 48); ctx.fillStyle = c.trim; ctx.beginPath(); ctx.arc(cx + 19, cy - 26, 6, 0, Math.PI * 2); ctx.fill(); }
  else { ctx.strokeStyle = '#8a5a2a'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(cx + 20, cy + 2, 18, -1.2, 1.2); ctx.stroke(); }
  ctx.restore();
}

function wrapText(text, cx, y, maxW, lh) {
  const words = text.split(' ');
  let line = '', yy = y;
  for (const w of words) {
    const test = line + w + ' ';
    if (ctx.measureText(test).width > maxW && line) { ctx.fillText(line.trim(), cx, yy); line = w + ' '; yy += lh; }
    else line = test;
  }
  ctx.fillText(line.trim(), cx, yy);
}

function drawNextMap() {
  ctx.fillStyle = 'rgba(0,200,255,0.15)';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#00FFFF';
  ctx.font = 'bold 32px monospace';
  ctx.textAlign = 'center';
  ctx.shadowBlur = 20;
  ctx.shadowColor = '#00FFFF';
  const next = currentMapIdx + 1;
  const name = next < MAPS.length ? MAPS[next].name : MAPS[0].name;
  ctx.fillText(`Entering: ${name}`, W / 2, H / 2);
  ctx.shadowBlur = 0;
}

// ─── Utilities ────────────────────────────────────────────────────────────────
function roundRect(ctx, x, y, w, h, r = 4) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function shadeColor(hex, amount) {
  const num = parseInt(hex.slice(1), 16);
  const r = Math.max(0, Math.min(255, (num >> 16) + amount));
  const g = Math.max(0, Math.min(255, ((num >> 8) & 0xff) + amount));
  const b = Math.max(0, Math.min(255, (num & 0xff) + amount));
  return `rgb(${r},${g},${b})`;
}

// ─── Main loop ────────────────────────────────────────────────────────────────
function loop(ts) {
  update(ts);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
