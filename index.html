<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const W = 960, H = 540;
canvas.width = W;
canvas.height = H;

// ─── Constants ───────────────────────────────────────────────────────────────
const GRAVITY = 0.55;
const JUMP_FORCE = -13;
const MOVE_SPEED = 4;
const TILE = 32;
const ATTACK_RANGE = 70;
const ATTACK_COOLDOWN = 400;

// ─── Input ────────────────────────────────────────────────────────────────────
const keys = {};
document.addEventListener('keydown', e => {
  ensureAudio();
  if (!keys[e.code]) {
    keys[e.code] = true;
    handleKeyPress(e.code);
  }
  e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

// ─── Touch controls ───────────────────────────────────────────────────────────
// Reuse the keyboard model: held buttons set keys[code], presses fire handleKeyPress.
let touchEl = null;
const isTouchDevice = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
(function setupTouch() {
  touchEl = document.getElementById('touch');
  const isTouch = isTouchDevice;
  if (isTouch) touchEl.classList.add('active');

  function pressCode(code) {
    ensureAudio();
    if (!keys[code]) {            // mirror the keydown debounce
      keys[code] = true;
      handleKeyPress(code);
    }
  }
  function releaseCode(code) { keys[code] = false; }

  document.querySelectorAll('.tbtn').forEach(btn => {
    const code = btn.dataset.code;
    const down = e => { e.preventDefault(); btn.classList.add('held'); pressCode(code); };
    const up   = e => { e.preventDefault(); btn.classList.remove('held'); releaseCode(code); };
    btn.addEventListener('touchstart', down, { passive: false });
    btn.addEventListener('touchend', up, { passive: false });
    btn.addEventListener('touchcancel', up, { passive: false });
    // Mouse fallback for desktop testing
    btn.addEventListener('mousedown', down);
    btn.addEventListener('mouseup', up);
    btn.addEventListener('mouseleave', e => { if (btn.classList.contains('held')) up(e); });
  });
})();

// Tap directly on a class card to pick it (in addition to ◀ ▶ + confirm button).
function canvasPoint(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  return { x: (clientX - r.left) * (W / r.width), y: (clientY - r.top) * (H / r.height) };
}
function handleCanvasTap(cx, cy) {
  if (inventoryOpen) { handleInventoryTap(cx, cy); return; }
  if (gameState === 'classselect') {
    // Continue banner tap
    if (getSave() && cx >= W / 2 - 170 && cx <= W / 2 + 170 && cy >= 448 && cy <= 482) {
      continueGame();
      return;
    }
    const cardW = 250, gap = 30;
    const total = CLASSES.length * cardW + (CLASSES.length - 1) * gap;
    const startX = W / 2 - total / 2;
    for (let i = 0; i < CLASSES.length; i++) {
      const x = startX + i * (cardW + gap);
      if (cx >= x && cx <= x + cardW && cy >= 150 && cy <= 430) {
        if (classHover === i) startGame(i); else classHover = i;
        return;
      }
    }
  }
}

function handleInventoryTap(cx, cy) {
  const PW = 480, PH = 340, PX = W / 2 - 240, PY = H / 2 - 170;
  // Close button
  if (cx >= PX + PW - 32 && cx <= PX + PW - 8 && cy >= PY + 7 && cy <= PY + 29) {
    inventoryOpen = false; inventorySelectedSlot = -1; return;
  }
  // Tap outside panel — close
  if (cx < PX || cx > PX + PW || cy < PY || cy > PY + PH) {
    inventoryOpen = false; inventorySelectedSlot = -1; return;
  }
  // Item slots (5 cols × 4 rows)
  const SLOT = 52, GAP = 4, GX = PX + 16, GY = PY + 44;
  for (let idx = 0; idx < 20; idx++) {
    const c = idx % 5, r = Math.floor(idx / 5);
    const sx = GX + c * (SLOT + GAP), sy = GY + r * (SLOT + GAP);
    if (cx >= sx && cx <= sx + SLOT && cy >= sy && cy <= sy + SLOT) {
      if (idx < player.inventory.length) {
        if (inventorySelectedSlot === idx) {
          useInventoryItem(idx); // second tap: use/equip
        } else {
          inventorySelectedSlot = idx;
        }
      }
      return;
    }
  }
  // USE/EQUIP action button
  const INFO_Y = PY + 276;
  if (inventorySelectedSlot >= 0 &&
      cx >= PX + PW - 120 && cx <= PX + PW - 32 &&
      cy >= INFO_Y + 12 && cy <= INFO_Y + 40) {
    useInventoryItem(inventorySelectedSlot); return;
  }
}
canvas.addEventListener('click', e => { const p = canvasPoint(e.clientX, e.clientY); handleCanvasTap(p.x, p.y); });
canvas.addEventListener('touchstart', e => {
  if (gameState !== 'classselect' && !inventoryOpen) return;
  ensureAudio();
  e.preventDefault();
  const t = e.changedTouches[0];
  const p = canvasPoint(t.clientX, t.clientY);
  handleCanvasTap(p.x, p.y);
}, { passive: false });

// ─── Audio (tiny WebAudio synth) ──────────────────────────────────────────────
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
const sfxLast = {};
function tone(f0, f1, dur, wave, vol) {
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = wave;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(t); o.stop(t + dur);
}
function sfx(name) {
  if (!audioCtx || audioCtx.state !== 'running') return;
  const now = performance.now();
  if (sfxLast[name] && now - sfxLast[name] < 45) return; // throttle AoE spam
  sfxLast[name] = now;
  switch (name) {
    case 'jump':    tone(300, 620, 0.12, 'square', 0.05); break;
    case 'attack':  tone(220, 90, 0.08, 'sawtooth', 0.06); break;
    case 'skill':   tone(420, 950, 0.16, 'sine', 0.08); break;
    case 'hit':     tone(160, 60, 0.09, 'square', 0.07); break;
    case 'crit':    tone(700, 180, 0.14, 'sawtooth', 0.09); break;
    case 'kill':    tone(500, 1000, 0.18, 'triangle', 0.08); break;
    case 'pickup':  tone(820, 1300, 0.09, 'sine', 0.06); break;
    case 'coin':    tone(1100, 1550, 0.07, 'sine', 0.05); break;
    case 'potion':  tone(560, 1050, 0.14, 'sine', 0.07); break;
    case 'equip':   tone(360, 720, 0.16, 'triangle', 0.08); break;
    case 'hurt':    tone(130, 45, 0.22, 'sawtooth', 0.1); break;
    case 'death':   tone(240, 35, 0.65, 'sawtooth', 0.11); break;
    case 'portal':  tone(400, 1400, 0.4, 'sine', 0.08); break;
    case 'levelup':
      tone(523, 523, 0.1, 'square', 0.06);
      setTimeout(() => audioCtx && tone(659, 659, 0.1, 'square', 0.06), 100);
      setTimeout(() => audioCtx && tone(784, 1046, 0.25, 'square', 0.07), 200);
      break;
    case 'rope':    tone(260, 320, 0.06, 'triangle', 0.04); break;
  }
}

// ─── Enemy factory ────────────────────────────────────────────────────────────
const RANGED_MOBS = ['Fire Boar', 'Curse Eye', 'Evil Eye', 'Wraith', 'Jr. Balrog'];
function makeEnemy(x, y, name, hp, atk, color, exp) {
  return {
    x, y: y - 36, w: 36, h: 36,
    name, color, exp,
    hp, maxHp: hp, atk,
    vx: (Math.random() < 0.5 ? -1 : 1),
    vy: 0, onGround: false,
    dir: 1, patrolTimer: 0,
    attackCooldown: 0, alive: true,
    hitFlash: 0, spawnX: x, spawnY: y - 36,
    patrolRange: 120 + Math.random() * 60,
    animFrame: 0, animTimer: 0,
    respawnTimer: 0,
    ranged: RANGED_MOBS.includes(name),
    rangedCd: 1000 + Math.random() * 1500,
  };
}

];

function spawnDrop(x, y, mapId) {
  const r = Math.random();
  let item;
  if (r < 0.55) {
    item = { ...ITEM_TYPES[0], value: 10 + Math.floor(Math.random() * 50 * (mapId + 1)) };
  } else if (r < 0.75) {
    item = { ...ITEM_TYPES[1] };
  } else if (r < 0.82) {
    item = { ...ITEM_TYPES[2] };
  } else if (r < 0.88) {
    item = { ...ITEM_TYPES[3] };
  } else if (r < 0.94) {
    item = { ...ITEM_TYPES[4] };
  } else {
    item = { ...ITEM_TYPES[5] };
  }
  drops.push({
    ...item,
    x: x + (Math.random() - 0.5) * 60,
    y: y - 10,
    vy: -5, vx: (Math.random() - 0.5) * 3,
    life: 600, glowPhase: 0,
  });
}

// ─── Player ───────────────────────────────────────────────────────────────────
const player = {
  x: 120, y: 380,
  w: 30, h: 42,
  vx: 0, vy: 0,
  dir: 1,
  onGround: false,
  jumpsLeft: 2,
  // Class
  cls: CLASSES[0],
  // Stats
  level: 1, exp: 0, expNeeded: 100,
  hp: 280, maxHp: 280,
  mp: 60, maxMp: 60,
  atk: 24, baseAtk: 24, spd: 0,
  meso: 0,
  // State
  attacking: false,
  attackTimer: 0,
  attackCooldown: 0,
  invincible: 0,
  animFrame: 0,
  animTimer: 0,
  state: 'idle',
  buffAtk: 1, buffTimer: 0,
  climbing: false, climbRope: null,
  skills: CLASSES[0].skills,
  inventory: [],
  equip: { weapon: null, shoes: null },
};

function applyClass(cls) {
  player.cls = cls;
  player.maxHp = cls.maxHp; player.hp = cls.maxHp;
  player.maxMp = cls.maxMp; player.mp = cls.maxMp;
  player.atk = cls.atk; player.baseAtk = cls.atk;
  player.spd = cls.spd;
  // Fresh skill objects so cooldowns don't leak between classes
  player.skills = cls.skills.map(s => ({ ...s, cooldown: 0 }));
}

// Effective attack including Rage buff
function playerAtk() { return player.atk * (player.buffTimer > 0 ? player.buffAtk : 1); }

// ─── Projectiles & skill effects ───────────────────────────────────────────────
const projectiles = [];
const enemyProjectiles = [];
const effects = [];
function spawnEffect(o) { o.maxLife = o.life; effects.push(o); }
let shake = 0;

// Ambient atmosphere particles (screen space): leaves / dust / fireflies
const ambient = [];

// Deterministic 0..1 hash for stable per-x terrain detail
function hash01(n) {
  const s = Math.sin(n * 127.1) * 43758.545;
  return s - Math.floor(s);
}

// ─── Game state ───────────────────────────────────────────────────────────────
let currentMapIdx = 0;
let map = MAPS[0];
let enemies = [];
let camera = { x: 0, y: 0 };
let gameState = 'classselect'; // 'classselect' | 'playing' | 'dead' | 'levelup' | 'nextmap'
let levelUpTimer = 0;
let nextMapTimer = 0;
let totalMobsKilled = 0;
let classHover = 0;
let inventoryOpen = false;
let inventorySelectedSlot = -1;

function startGame(classIdx) {
  applyClass(CLASSES[classIdx]);
  player.level = 1; player.exp = 0; player.expNeeded = 100;
  player.meso = 0; totalMobsKilled = 0;
  player.buffTimer = 0; player.buffAtk = 1;
  player.inventory = [];
  player.equip = { weapon: null, shoes: null };
  inventoryOpen = false; inventorySelectedSlot = -1;
  loadMap(0);
  gameState = 'playing';
  saveGame();
}

// ─── Save / Load (localStorage) ───────────────────────────────────────────────
const SAVE_KEY = 'msclone-save';
function saveGame() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      classIdx: CLASSES.indexOf(player.cls),
      level: player.level, exp: player.exp, expNeeded: player.expNeeded,
      maxHp: player.maxHp, maxMp: player.maxMp,
      atk: player.atk, baseAtk: player.baseAtk, spd: player.spd,
      meso: player.meso, kills: totalMobsKilled,
      inventory: player.inventory, equip: player.equip,
      mapIdx: currentMapIdx,
    }));
  } catch (e) { /* storage unavailable (private mode / sandbox) */ }
}
function getSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (typeof s.classIdx !== 'number' || !CLASSES[s.classIdx]) return null;
    return s;
  } catch (e) { return null; }
}
function continueGame() {
  const s = getSave();
  if (!s) return false;
  applyClass(CLASSES[s.classIdx]);
  player.level = s.level; player.exp = s.exp; player.expNeeded = s.expNeeded;
  player.maxHp = s.maxHp; player.hp = s.maxHp;
  player.maxMp = s.maxMp; player.mp = s.maxMp;
  player.atk = s.atk; player.baseAtk = s.baseAtk; player.spd = s.spd;
  player.meso = s.meso; totalMobsKilled = s.kills || 0;
  player.inventory = s.inventory || [];
  player.equip = s.equip || { weapon: null, shoes: null };
  player.buffTimer = 0; player.buffAtk = 1;
  inventoryOpen = false; inventorySelectedSlot = -1;
  loadMap(Math.min(s.mapIdx || 0, MAPS.length - 1));
  gameState = 'playing';
  return true;
}

function loadMap(idx) {
  currentMapIdx = idx;
  map = MAPS[idx];
  drops.length = 0;
  projectiles.length = 0;
  enemyProjectiles.length = 0;
  particles.length = 0;
  ambient.length = 0;
  enemies = map.spawnEnemies();
  player.x = 120;
  player.y = map.ground - player.h;
  player.vx = 0;
  player.vy = 0;
  player.climbing = false;
  player.climbRope = null;
  camera.x = 0;
  inventoryOpen = false;
  inventorySelectedSlot = -1;
}

loadMap(0);

// ─── Input handler ────────────────────────────────────────────────────────────
function handleKeyPress(code) {
  if (gameState === 'classselect') {
    if (code === 'ArrowLeft' || code === 'KeyA') classHover = (classHover + CLASSES.length - 1) % CLASSES.length;
    if (code === 'ArrowRight' || code === 'KeyD') classHover = (classHover + 1) % CLASSES.length;
    if (code === 'Digit1') { classHover = 0; }
    if (code === 'Digit2') { classHover = 1; }
    if (code === 'Digit3') { classHover = 2; }
    if (code === 'KeyC' && getSave()) { continueGame(); return; }
    if (code === 'Space' || code === 'Enter' || code === 'KeyZ') startGame(classHover);
    return;
  }
  if (gameState === 'dead') {
    if (code === 'Space' || code === 'Enter') respawn();
    return;
  }

  // Inventory toggle works in any active state
  if (code === 'KeyI') {
    inventoryOpen = !inventoryOpen;
    if (!inventoryOpen) inventorySelectedSlot = -1;
    return;
  }
  if (code === 'Escape' && inventoryOpen) {
    inventoryOpen = false;
    inventorySelectedSlot = -1;
    return;
  }
  if (inventoryOpen) return; // block all other input while inventory is open

  if (gameState !== 'playing') return;

  if (code === 'ArrowUp' || code === 'KeyW' || code === 'Space') {
    // Jump off a rope
    if (player.climbing && code === 'Space') {
      player.climbing = false; player.climbRope = null;
      player.vy = JUMP_FORCE * 0.8;
      player.jumpsLeft = 1;
      sfx('jump');
      return;
    }
    // Grab a nearby rope (Up only, so Space still double-jumps)
    if (!player.climbing && code !== 'Space' && tryGrabRope()) return;
    if (!player.climbing && player.jumpsLeft > 0) {
      player.vy = JUMP_FORCE * (player.jumpsLeft === 1 ? 0.85 : 1);
      player.jumpsLeft--;
      player.onGround = false;
      spawnParticles(player.x + player.w / 2, player.y + player.h, '#cceeff', 4);
      sfx('jump');
    }
  }
  if (code === 'KeyZ' || code === 'KeyA') {
    if (player.climbing) return;
    doBasicAttack();
  }
  for (const skill of player.skills) {
    if (code === skill.key && !player.climbing) {
      useSkill(skill);
    }
  }
  if (code === 'KeyF') {
    pickupNearby();
  }
  if (code === 'KeyX') quickPotion('hp');
  if (code === 'KeyC') quickPotion('mp');
}

function tryGrabRope() {
  if (!map.ropes) return false;
  const pcx = player.x + player.w / 2;
  for (const r of map.ropes) {
    if (Math.abs(pcx - r.x) < 16 && player.y + player.h > r.y1 && player.y < r.y2) {
      player.climbing = true;
      player.climbRope = r;
      player.x = r.x - player.w / 2;
      player.vx = 0; player.vy = 0;
      sfx('rope');
      return true;
    }
  }
  return false;
}

function quickPotion(kind) {
  const idx = player.inventory.findIndex(it => !it.isEquip && (kind === 'hp' ? it.healHp : it.healMp));
  if (idx >= 0) useInventoryItem(idx);
  else spawnDamageNumber(player.x + player.w / 2, player.y - 18, kind === 'hp' ? 'No HP potion!' : 'No MP potion!', '#888');
}

function respawn() {
  player.hp = player.maxHp;
  player.mp = player.maxMp;
  player.exp = Math.floor(player.exp * 0.9);
  player.meso = Math.floor(player.meso * 0.9);
  loadMap(currentMapIdx);
  gameState = 'playing';
}

// ─── Combat ───────────────────────────────────────────────────────────────────
function doBasicAttack() {
  if (player.attackCooldown > 0) return;
  player.attacking = true;
  player.attackTimer = 260;
  player.attackCooldown = ATTACK_COOLDOWN;
  sfx('attack');
  const weapon = player.cls.weapon;
  const cx = player.x + player.w / 2, cy = player.y + player.h / 2;

  if (weapon === 'bow' || weapon === 'staff') {
    // Ranged classes fire a weak basic shot
    projectiles.push({
      x: cx + player.dir * 16, y: cy,
      vx: player.dir * 9, vy: 0,
      dmg: Math.floor(playerAtk() * (0.9 + Math.random() * 0.2)),
      color: weapon === 'bow' ? '#e8d090' : '#9fd0ff',
      life: 65, fx: weapon === 'bow' ? 'arrow' : 'bolt', dir: player.dir,
    });
    return;
  }
  // Melee swing
  const px = player.x + (player.dir > 0 ? player.w : -ATTACK_RANGE);
  spawnEffect({ type: 'slash', x: player.x + (player.dir > 0 ? player.w : 0), y: player.y, dir: player.dir, color: '#ffffff', life: 8, range: ATTACK_RANGE });
  for (const e of enemies) {
    if (!e.alive) continue;
    if (rectsOverlap(px, player.y, ATTACK_RANGE, player.h + 10, e.x, e.y, e.w, e.h)) {
      hitEnemy(e, Math.floor(playerAtk() * (0.9 + Math.random() * 0.2)), '#fff');
    }
  }
}

function useSkill(skill) {
  if (gameState !== 'playing') return;
  if (skill.cooldown > 0 || player.mp < skill.mpCost) return;
  player.mp -= skill.mpCost;
  skill.cooldown = skill.maxCd;
  player.attacking = true;
  player.attackTimer = 240;
  sfx('skill');
  if (skill.fx === 'thunder') shake = 7;
  const cx = player.x + player.w / 2, cy = player.y + player.h / 2;

  // ── Self-buff (Rage) ──
  if (skill.fx === 'buff') {
    player.buffAtk = skill.buffAtk;
    player.buffTimer = skill.buffDur;
    spawnEffect({ type: 'buff', x: cx, y: player.y + 20, color: skill.color, life: 36 });
    spawnParticles(cx, cy, skill.color, 26);
    spawnDamageNumber(cx, player.y - 12, 'RAGE!', skill.color);
    return;
  }

  // ── Projectile skills (Energy Bolt, Magic Claw, Arrow Blow, Double Shot) ──
  if (skill.projectile) {
    const n = skill.multi || 1;
    for (let i = 0; i < n; i++) {
      const spread = (i - (n - 1) / 2);
      projectiles.push({
        x: cx + player.dir * 16,
        y: cy + spread * 8,
        vx: player.dir * (skill.fx === 'arrow' ? 13 : 10),
        vy: skill.fx === 'claw' ? spread * 1.4 : 0,
        dmg: Math.floor(playerAtk() * skill.dmgMult),
        color: skill.color, life: 80, fx: skill.fx, dir: player.dir,
      });
    }
    spawnParticles(cx + player.dir * 14, cy, skill.color, 8);
    return;
  }

  // ── Full-area burst (Thunder Bolt, Arrow Rain) ──
  if (skill.aoeFull) {
    const R = 210;
    spawnEffect({ type: skill.fx, x: cx, y: player.y, color: skill.color, life: skill.fx === 'rain' ? 26 : 18, r: R });
    for (const e of enemies) {
      if (!e.alive) continue;
      const ex = e.x + e.w / 2, ey = e.y + e.h / 2;
      if (Math.abs(ex - cx) < R && Math.abs(ey - cy) < 170) {
        hitEnemy(e, Math.floor(playerAtk() * skill.dmgMult * (0.85 + Math.random() * 0.3)), skill.color);
      }
    }
    return;
  }

  // ── Melee arcs (Power Strike, Slash Blast) ──
  const range = skill.range || ATTACK_RANGE;
  spawnEffect({ type: skill.fx, x: player.x + (player.dir > 0 ? player.w : 0), y: player.y, dir: player.dir, color: skill.color, life: 14, range });
  const px = player.x + (player.dir > 0 ? player.w : -range);
  for (const e of enemies) {
    if (!e.alive) continue;
    if (rectsOverlap(px, player.y - 15, range, player.h + 30, e.x, e.y, e.w, e.h)) {
      hitEnemy(e, Math.floor(playerAtk() * skill.dmgMult * (0.9 + Math.random() * 0.2)), skill.color);
    }
  }
}

function hitEnemy(e, dmg, color) {
  // Critical hits
  const crit = Math.random() < 0.15;
  if (crit) {
    dmg = Math.floor(dmg * 1.6);
    shake = Math.max(shake, 4);
  }
  e.hp -= dmg;
  e.hitFlash = 8;
  // Knockback away from the player; brief stagger so the AI doesn't cancel it
  const kdir = (e.x + e.w / 2) >= (player.x + player.w / 2) ? 1 : -1;
  e.vx = kdir * 3.5;
  e.knock = 220;
  spawnDamageNumber(e.x + e.w / 2, e.y - 5, crit ? `CRIT ${dmg}` : dmg, crit ? '#ff9a1e' : color);
  spawnParticles(e.x + e.w / 2, e.y + e.h / 2, color, crit ? 8 : 4);
  sfx(crit ? 'crit' : 'hit');
  if (e.hp <= 0) killEnemy(e);
}

function killEnemy(e) {
  e.alive = false;
  e.respawnTimer = 9000 + Math.random() * 5000;
  totalMobsKilled++;
  spawnParticles(e.x + e.w / 2, e.y + e.h / 2, e.color, 12);
  spawnEffect({ type: 'poof', x: e.x + e.w / 2, y: e.y + e.h / 2, color: e.color, life: 16 });
  spawnDrop(e.x + e.w / 2, e.y + e.h, currentMapIdx);
  sfx('kill');
  gainExp(e.exp);
  saveGame();
}

function gainExp(amount) {
  player.exp += amount;
  while (player.exp >= player.expNeeded) {
    player.exp -= player.expNeeded;
    levelUp();
  }
}

function levelUp() {
  const c = player.cls;
  player.level++;
  player.expNeeded = Math.floor(100 * Math.pow(1.3, player.level - 1));
  player.maxHp += c.hpPerLv;
  player.maxMp += c.mpPerLv;
  player.hp = player.maxHp;
  player.mp = player.maxMp;
  player.atk += c.atkPerLv;
  player.baseAtk += c.atkPerLv;
  gameState = 'levelup';
  levelUpTimer = 120;
  spawnParticles(player.x + player.w / 2, player.y, '#FFD700', 20);
  sfx('levelup');
  saveGame();
}

function pickupNearby() {
  for (let i = drops.length - 1; i >= 0; i--) {
    const d = drops[i];
    const dist = Math.hypot(d.x - (player.x + player.w / 2), d.y - (player.y + player.h / 2));
    if (dist < 60) {
      applyItem(d);
      drops.splice(i, 1);
    }
  }
}

function applyItem(item) {
  if (item.isMeso) {
    player.meso += item.value;
    spawnParticles(player.x + 15, player.y + 10, '#FFD700', 4);
    sfx('coin');
    return;
  }
  // Consumables stack; equips take their own slot
  if (!item.isEquip) {
    const existing = player.inventory.find(it => it.name === item.name && !it.isEquip);
    if (existing) {
      existing.qty = (existing.qty || 1) + 1;
      spawnDamageNumber(player.x + player.w / 2, player.y - 14, `${item.name} ×${existing.qty}`, item.color);
      sfx('pickup');
      return;
    }
  }
  if (player.inventory.length < 20) {
    player.inventory.push({ ...item, qty: 1 });
    spawnDamageNumber(player.x + player.w / 2, player.y - 14, item.name, item.color);
    spawnParticles(player.x + 15, player.y + 10, item.color, 3);
    sfx('pickup');
  } else {
    spawnDamageNumber(player.x + player.w / 2, player.y - 14, 'INV FULL!', '#ff4444');
  }
}

function useInventoryItem(idx) {
  if (idx < 0 || idx >= player.inventory.length) return;
  const item = player.inventory[idx];
  if (item.isEquip) {
    equipItem(item, idx);
  } else {
    if (item.healHp) player.hp = Math.min(player.maxHp, player.hp + item.healHp);
    if (item.healMp) player.mp = Math.min(player.maxMp, player.mp + item.healMp);
    const parts = [];
    if (item.healHp) parts.push(`HP+${item.healHp}`);
    if (item.healMp) parts.push(`MP+${item.healMp}`);
    spawnDamageNumber(player.x + player.w / 2, player.y - 18, parts.join(' ') || 'Used!', item.color);
    spawnParticles(player.x + player.w / 2, player.y + player.h / 2, item.color, 6);
    sfx('potion');
    item.qty = (item.qty || 1) - 1;
    if (item.qty <= 0) player.inventory.splice(idx, 1);
  }
  inventorySelectedSlot = -1;
}

function equipItem(item, idx) {
  const slot = item.stat === 'atk' ? 'weapon' : 'shoes';
  const old = player.equip[slot];
  if (old) {
    if (old.stat === 'atk') player.atk -= old.statVal;
    if (old.stat === 'spd') player.spd -= old.statVal;
    player.inventory[idx] = { ...old }; // swap old into inventory slot
  } else {
    player.inventory.splice(idx, 1);
  }
  player.equip[slot] = { ...item };
  if (item.stat === 'atk') player.atk += item.statVal;
  if (item.stat === 'spd') player.spd += item.statVal;
  spawnDamageNumber(player.x + player.w / 2, player.y - 18, 'EQUIPPED!', item.color);
  spawnParticles(player.x + player.w / 2, player.y + player.h / 2, item.color, 8);
  sfx('equip');
  saveGame();
}

// ─── Collision Helpers ────────────────────────────────────────────────────────
function rectsOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

function getAllSurfaces() {
  const surfaces = [];
  // Ground
  surfaces.push({ x: -1000, y: map.ground, w: map.width + 2000, h: 200, isGround: true });
  // Map walls
  surfaces.push({ x: -50, y: 0, w: 50, h: map.ground + 200, isWall: true, wallRight: true });
  surfaces.push({ x: map.width, y: 0, w: 50, h: map.ground + 200, isWall: true, wallLeft: true });
  // Platforms
  for (const p of map.platforms) {
    surfaces.push({ x: p.x, y: p.y, w: p.w, h: 14, isPlatform: true });
  }
  return surfaces;
}

function applyPhysics(obj, canFallThrough = false) {
  obj.vy += GRAVITY;
  if (obj.vy > 18) obj.vy = 18;

  const surfaces = getAllSurfaces();
  const prevY = obj.y;
  const prevOnGround = obj.onGround;
  obj.onGround = false;

  obj.x += obj.vx;
  // Horizontal wall check
  for (const s of surfaces) {
    if (s.isWall) {
      if (s.wallRight && obj.x < s.x + s.w && obj.x > s.x) obj.x = s.x + s.w;
      if (s.wallLeft && obj.x + obj.w > s.x && obj.x < s.x) obj.x = s.x - obj.w;
    }
  }

  obj.y += obj.vy;
  // Vertical collision
  for (const s of surfaces) {
    if (s.isWall) continue;
    if (obj.x + obj.w <= s.x || obj.x >= s.x + s.w) continue;
    if (s.isPlatform && canFallThrough) continue;
    // Landing on top
    if (obj.vy >= 0 && prevY + obj.h <= s.y + 4 && obj.y + obj.h >= s.y) {
      obj.y = s.y - obj.h;
      obj.vy = 0;
      obj.onGround = true;
    }
    // Hitting from below (only for solid ground)
    if (!s.isPlatform && obj.vy < 0 && prevY >= s.y + s.h - 4 && obj.y < s.y + s.h) {
      obj.y = s.y + s.h;
      obj.vy = 0;
    }
  }
}

// ─── Update ───────────────────────────────────────────────────────────────────
let lastTime = 0;
function update(ts) {
  const dt = Math.min(ts - lastTime, 50);
  lastTime = ts;

  // Show the on-screen pad only during active play
  if (touchEl && isTouchDevice) {
    touchEl.classList.toggle('active', gameState === 'playing' || gameState === 'levelup');
  }

  updateEffects(dt);

  if (gameState === 'classselect') return;

  updateAmbient(dt);

  if (gameState === 'levelup') {
    levelUpTimer--;
    if (levelUpTimer <= 0) gameState = 'playing';
  }
  if (gameState === 'nextmap') {
    nextMapTimer--;
    if (nextMapTimer <= 0) {
      const next = currentMapIdx + 1;
      if (next < MAPS.length) loadMap(next);
      else { loadMap(0); }
      gameState = 'playing';
      saveGame();
    }
  }
  if (gameState === 'dead') return;

  updatePlayer(dt);
  updateEnemies(dt);
  updateEnemyProjectiles();
  updateDrops();
  updateProjectiles();
  updateParticles();
  updateCamera();
  autoPickup();
}

function updatePlayer(dt) {
  if (inventoryOpen) { player.vx = 0; return; }
  const spd = MOVE_SPEED + player.spd;
  let moving = false;

  // ── Rope climbing ──
  if (player.climbing) {
    const r = player.climbRope;
    player.vx = 0; player.vy = 0;
    player.x = r.x - player.w / 2;
    if (keys['ArrowUp'] || keys['KeyW']) { player.y -= 2.4; moving = true; }
    if (keys['ArrowDown'] || keys['KeyS']) { player.y += 2.8; moving = true; }
    // Reached the top: hop onto whatever the rope leads to
    if (player.y < r.y1 - player.h + 6) {
      player.y = r.y1 - player.h;
      player.climbing = false; player.climbRope = null;
      player.vy = -4;
      player.jumpsLeft = 1;
    }
    // Slid off the bottom
    if (player.y + player.h > r.y2) {
      player.y = r.y2 - player.h;
      player.climbing = false; player.climbRope = null;
    }
    // Walk off the rope
    if (keys['ArrowLeft'] || keys['ArrowRight']) {
      player.climbing = false; player.climbRope = null;
    }
    player.state = 'climb';
    player.animTimer += dt;
    if (moving && player.animTimer > 180) { player.animFrame = (player.animFrame + 1) % 4; player.animTimer = 0; }
    // Timers still tick while climbing
    if (player.attackCooldown > 0) player.attackCooldown -= dt;
    if (player.invincible > 0) player.invincible -= dt;
    if (player.buffTimer > 0) player.buffTimer -= dt;
    for (const s of player.skills) if (s.cooldown > 0) s.cooldown -= dt;
    return;
  }

  if (keys['ArrowLeft'] || keys['KeyA']) {
    player.vx = -spd;
    player.dir = -1;
    moving = true;
  } else if (keys['ArrowRight'] || keys['KeyD']) {
    player.vx = spd;
    player.dir = 1;
    moving = true;
  } else {
    player.vx *= 0.7;
  }

  const wasOnGround = player.onGround;
  applyPhysics(player, keys['ArrowDown'] || keys['KeyS']);
  if (player.onGround && !wasOnGround) player.jumpsLeft = 2;
  if (!player.onGround && player.jumpsLeft === 2) player.jumpsLeft = 1;

  // Clamp to map
  player.x = Math.max(0, Math.min(map.width - player.w, player.x));

  // Timers
  if (player.attackTimer > 0) { player.attackTimer -= dt; if (player.attackTimer <= 0) player.attacking = false; }
  if (player.attackCooldown > 0) player.attackCooldown -= dt;
  if (player.invincible > 0) player.invincible -= dt;
  if (player.buffTimer > 0) {
    player.buffTimer -= dt;
    if (Math.random() < 0.25) spawnParticles(player.x + player.w / 2, player.y + 30, '#ff4040', 1);
  }
  for (const s of player.skills) if (s.cooldown > 0) s.cooldown -= dt;

  // Animation
  player.animTimer += dt;
  if (player.animTimer > 150) { player.animFrame = (player.animFrame + 1) % 4; player.animTimer = 0; }
  player.state = !player.onGround ? 'jump' : (moving ? 'walk' : 'idle');

  // MP regen
  if (Math.random() < 0.01) player.mp = Math.min(player.maxMp, player.mp + 1);

  // Portal check
  const portal = map.portal;
  if (portal && rectsOverlap(player.x, player.y, player.w, player.h, portal.x, portal.y, 30, 60)) {
    gameState = 'nextmap';
    nextMapTimer = 80;
    sfx('portal');
  }
}

function updateEnemies(dt) {
  for (const e of enemies) {
    // Respawn countdown for defeated mobs
    if (!e.alive) {
      if (e.respawnTimer > 0) {
        e.respawnTimer -= dt;
        if (e.respawnTimer <= 0) {
          e.alive = true;
          e.hp = e.maxHp;
          e.x = e.spawnX;
          e.y = e.spawnY;
          e.vx = (Math.random() < 0.5 ? -1 : 1);
          e.vy = 0;
          e.attackCooldown = 600;
          spawnParticles(e.x + e.w / 2, e.y + e.h / 2, e.color, 10);
        }
      }
      continue;
    }
    if (e.hitFlash > 0) e.hitFlash--;
    if (e.attackCooldown > 0) e.attackCooldown -= dt;

    // Ranged mobs lob a shot at the player
    if (e.ranged) {
      e.rangedCd -= dt;
      const pdist = Math.hypot(player.x - e.x, player.y - e.y);
      if (e.rangedCd <= 0 && pdist < 380 && pdist > 60) {
        const sx = e.x + e.w / 2, sy = e.y + e.h / 2 - 4;
        const tx = player.x + player.w / 2, ty = player.y + player.h / 2;
        const a = Math.atan2(ty - sy, tx - sx);
        enemyProjectiles.push({
          x: sx, y: sy,
          vx: Math.cos(a) * 4.2, vy: Math.sin(a) * 4.2,
          dmg: Math.floor(e.atk * 0.8),
          color: e.name.includes('Fire') ? '#ff7a20' : (e.name.includes('Balrog') ? '#ff3050' : '#c060ff'),
          life: 130,
        });
        e.rangedCd = 2200 + Math.random() * 1200;
      }
    }

    e.animTimer = (e.animTimer || 0) + dt;
    if (e.animTimer > 200) { e.animFrame = (e.animFrame + 1) % 4; e.animTimer = 0; }

    // Stagger from knockback overrides normal movement briefly
    if (e.knock > 0) {
      e.knock -= dt;
      e.vx *= 0.92;
    } else {
      // Patrol AI
      e.patrolTimer += dt;
      if (e.patrolTimer > 1000 + Math.random() * 500) {
        e.vx = -e.vx;
        e.dir = e.vx > 0 ? 1 : -1;
        e.patrolTimer = 0;
      }

      // Chase player if nearby
      const distX = player.x - e.x;
      const distY = player.y - e.y;
      const dist = Math.hypot(distX, distY);
      if (dist < 250) {
        const chaseSpd = 1.2 + currentMapIdx * 0.3;
        e.vx = distX > 0 ? chaseSpd : -chaseSpd;
        e.dir = e.vx > 0 ? 1 : -1;
      }

      // Clamp patrol
      if (e.x < e.spawnX - e.patrolRange) e.vx = Math.abs(e.vx);
      if (e.x > e.spawnX + e.patrolRange) e.vx = -Math.abs(e.vx);
    }

    applyPhysics(e);

    // Attack player on contact
    if (e.attackCooldown <= 0 && player.invincible <= 0 &&
        rectsOverlap(e.x - 5, e.y - 5, e.w + 10, e.h + 10, player.x, player.y, player.w, player.h)) {
      hurtPlayer(e.atk, e.x + e.w / 2);
      e.attackCooldown = 1200;
    }
  }
}

function hurtPlayer(dmg, sourceX) {
  player.hp -= dmg;
  player.invincible = 800;
  spawnDamageNumber(player.x + player.w / 2, player.y - 10, dmg, '#FF4466');
  shake = Math.max(shake, 6);
  // Knockback away from the hit; getting knocked off a rope too
  player.climbing = false; player.climbRope = null;
  player.vx = (player.x + player.w / 2) < sourceX ? -4.5 : 4.5;
  player.vy = -3.5;
  sfx('hurt');
  if (player.hp <= 0) {
    player.hp = 0;
    gameState = 'dead';
    inventoryOpen = false; inventorySelectedSlot = -1;
    sfx('death');
  }
}

function updateEnemyProjectiles() {
  for (let i = enemyProjectiles.length - 1; i >= 0; i--) {
    const p = enemyProjectiles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life--;
    let done = p.life <= 0;
    if (!done && player.invincible <= 0 &&
        rectsOverlap(p.x - 5, p.y - 5, 10, 10, player.x, player.y, player.w, player.h)) {
      hurtPlayer(p.dmg, p.x);
      done = true;
    }
    if (done) enemyProjectiles.splice(i, 1);
  }
}

function updateDrops() {
  for (let i = drops.length - 1; i >= 0; i--) {
    const d = drops[i];
    d.vy += 0.4;
    d.y += d.vy;
    d.x += d.vx;
    d.vx *= 0.92;
    if (d.y > map.ground - 12) { d.y = map.ground - 12; d.vy *= -0.3; }
    d.life--;
    d.glowPhase += 0.1;
    if (d.life <= 0) drops.splice(i, 1);
  }
}

function updateProjectiles() {
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life--;
    let hit = false;
    for (const e of enemies) {
      if (!e.alive) continue;
      if (rectsOverlap(p.x - 6, p.y - 6, 12, 12, e.x, e.y, e.w, e.h)) {
        hitEnemy(e, p.dmg, p.color);
        hit = true;
        break;
      }
    }
    if (hit || p.life <= 0) projectiles.splice(i, 1);
  }
}

function updateEffects(dt) {
  for (let i = effects.length - 1; i >= 0; i--) {
    const f = effects[i];
    f.life--;
    if (f.fall) { f.y += f.vy; f.vy += 0.6; }
    if (f.life <= 0) effects.splice(i, 1);
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx || 0;
    p.y += (p.vy || 0);
    if (p.type !== 'text') p.vy = (p.vy || 0) + 0.1;
    p.life -= p.decay || 0.03;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function updateCamera() {
  const targetX = player.x + player.w / 2 - W / 2;
  camera.x += (targetX - camera.x) * 0.1;
  camera.x = Math.max(0, Math.min(map.width - W, camera.x));
}

function autoPickup() {
  for (let i = drops.length - 1; i >= 0; i--) {
    const d = drops[i];
    if (!d.isMeso) continue; // only meso auto-picks; other items need F key
    if (d.vy !== 0 && Math.abs(d.vy) > 0.5) continue;
    const dist = Math.hypot(d.x - (player.x + player.w / 2), d.y - (player.y + player.h));
    if (dist < 35) {
      applyItem(d);
      drops.splice(i, 1);
    }
  }
}

// ─── Draw ─────────────────────────────────────────────────────────────────────
function draw() {
  ctx.save();

  // Background gradient
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, map.bgColors[0]);
  grad.addColorStop(1, map.bgColors[1]);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Screen shake (world only; HUD is drawn after restore)
  if (shake > 0.4) {
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    shake *= 0.88;
  } else {
    shake = 0;
  }

  // Parallax BG elements
  drawBackground();

  ctx.translate(-camera.x, 0);

  // Ground
  drawGround();

  // Platforms
  for (const p of map.platforms) {
    drawPlatform(p);
  }

  // Ropes
  drawRopes();

  // Portal
  drawPortal();

  // Drops
  for (const d of drops) drawDrop(d);

  // Enemies
  for (const e of enemies) if (e.alive) drawEnemy(e);

  // Projectiles
  for (const p of projectiles) drawProjectile(p);
  for (const p of enemyProjectiles) drawEnemyProjectile(p);

  // Skill effects (slashes, thunder, rain, buff rings)
  drawEffects();

  // Player
  drawPlayer();

  // Particles
  drawParticles();

  ctx.restore();

  // Atmosphere overlays (screen space)
  drawAmbient();
  drawLighting();

  // HUD (fixed position)
  drawHUD();
  drawSkillBar();
  if (gameState === 'classselect') { drawClassSelect(); return; }
  if (gameState === 'dead') drawDeadScreen();
  if (gameState === 'levelup') drawLevelUp();
  if (gameState === 'nextmap') drawNextMap();
  drawInventory();
}

function drawProjectile(p) {
  ctx.save();
  ctx.shadowBlur = 12;
  ctx.shadowColor = p.color;
  if (p.fx === 'arrow') {
    ctx.strokeStyle = p.color;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(p.x - p.dir * 12, p.y);
    ctx.lineTo(p.x + p.dir * 8, p.y);
    ctx.stroke();
    // arrowhead
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.moveTo(p.x + p.dir * 12, p.y);
    ctx.lineTo(p.x + p.dir * 4, p.y - 4);
    ctx.lineTo(p.x + p.dir * 4, p.y + 4);
    ctx.fill();
  } else if (p.fx === 'claw') {
    ctx.fillStyle = p.color;
    for (let k = 0; k < 3; k++) {
      ctx.globalAlpha = 0.8 - k * 0.2;
      ctx.fillRect(p.x - p.dir * k * 6 - 3, p.y - 2, 5, 4);
    }
  } else {
    // bolt / generic orb with core
    const r = 6 + Math.sin(Date.now() / 60) * 1;
    ctx.fillStyle = p.color;
    ctx.globalAlpha = 0.9;
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.globalAlpha = 0.8;
    ctx.beginPath(); ctx.arc(p.x, p.y, r * 0.45, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function drawEnemyProjectile(p) {
  ctx.save();
  ctx.shadowBlur = 14;
  ctx.shadowColor = p.color;
  const r = 7 + Math.sin(Date.now() / 70) * 1.2;
  // Trail
  ctx.globalAlpha = 0.35;
  ctx.fillStyle = p.color;
  ctx.beginPath(); ctx.arc(p.x - p.vx * 2, p.y - p.vy * 2, r * 0.7, 0, Math.PI * 2); ctx.fill();
  // Core
  ctx.globalAlpha = 0.95;
  ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.globalAlpha = 0.75;
  ctx.beginPath(); ctx.arc(p.x, p.y, r * 0.4, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawRopes() {
  if (!map.ropes) return;
  for (const r of map.ropes) {
    ctx.strokeStyle = '#8a6a3a';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(r.x, r.y1);
    ctx.lineTo(r.x, r.y2);
    ctx.stroke();
    ctx.strokeStyle = '#b89058';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(r.x - 1, r.y1);
    ctx.lineTo(r.x - 1, r.y2);
    ctx.stroke();
    // Rungs
    ctx.strokeStyle = '#6a4a22';
    ctx.lineWidth = 2;
    for (let y = r.y1 + 10; y < r.y2 - 4; y += 14) {
      ctx.beginPath();
      ctx.moveTo(r.x - 5, y);
      ctx.lineTo(r.x + 5, y);
      ctx.stroke();
    }
  }
}

function drawEffects() {
  for (const f of effects) {
    const t = 1 - f.life / f.maxLife; // 0→1 progress
    ctx.save();
    if (f.type === 'slash' || f.type === 'cleave') {
      // Sweeping crescent arc in front of the player
      const reach = f.range || ATTACK_RANGE;
      const ox = f.x, oy = f.y + 21;
      const big = f.type === 'cleave';
      ctx.globalAlpha = 0.85 * (1 - t);
      ctx.strokeStyle = f.color;
      ctx.lineWidth = big ? 8 : 5;
      ctx.shadowBlur = 12; ctx.shadowColor = f.color;
      ctx.beginPath();
      const a0 = -1.1, a1 = 1.1;
      ctx.arc(ox, oy, reach * (0.6 + 0.4 * t), f.dir > 0 ? a0 : Math.PI - a0, f.dir > 0 ? a1 : Math.PI - a1, f.dir < 0);
      ctx.stroke();
      ctx.globalAlpha = 0.5 * (1 - t);
      ctx.lineWidth = big ? 3 : 2;
      ctx.strokeStyle = '#fff';
      ctx.stroke();
    } else if (f.type === 'thunder') {
      // Jagged lightning bolts striking down around the player
      ctx.globalAlpha = 1 - t;
      ctx.strokeStyle = f.color;
      ctx.lineWidth = 3;
      ctx.shadowBlur = 16; ctx.shadowColor = f.color;
      for (let b = 0; b < 5; b++) {
        const bx = f.x + (b - 2) * (f.r / 2.5);
        ctx.beginPath();
        ctx.moveTo(bx, f.y - 120);
        let yy = f.y - 120, xx = bx;
        while (yy < f.y + 60) { yy += 18; xx += (Math.random() - 0.5) * 22; ctx.lineTo(xx, yy); }
        ctx.stroke();
      }
      ctx.globalAlpha = 0.25 * (1 - t);
      ctx.fillStyle = f.color;
      ctx.fillRect(f.x - f.r, f.y - 130, f.r * 2, 200);
    } else if (f.type === 'rain') {
      // Volley of arrows raining down
      ctx.globalAlpha = 1 - t * 0.7;
      ctx.strokeStyle = f.color;
      ctx.lineWidth = 2;
      ctx.shadowBlur = 6; ctx.shadowColor = f.color;
      for (let a = 0; a < 14; a++) {
        const ax = f.x - f.r + (a / 13) * f.r * 2;
        const ay = f.y - 120 + ((t * 200 + a * 30) % 200);
        ctx.beginPath();
        ctx.moveTo(ax, ay);
        ctx.lineTo(ax - 4, ay - 12);
        ctx.stroke();
      }
    } else if (f.type === 'buff') {
      // Expanding power ring
      ctx.globalAlpha = 1 - t;
      ctx.strokeStyle = f.color;
      ctx.lineWidth = 4;
      ctx.shadowBlur = 14; ctx.shadowColor = f.color;
      ctx.beginPath();
      ctx.arc(f.x, f.y, 10 + t * 36, 0, Math.PI * 2);
      ctx.stroke();
    } else if (f.type === 'poof') {
      // Defeat puff: expanding double ring + drifting smoke balls
      ctx.globalAlpha = 0.8 * (1 - t);
      ctx.strokeStyle = f.color;
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(f.x, f.y, 6 + t * 26, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 0.4 * (1 - t);
      ctx.strokeStyle = '#fff';
      ctx.beginPath(); ctx.arc(f.x, f.y, 3 + t * 34, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = 'rgba(240,240,240,0.7)';
      for (let i = 0; i < 5; i++) {
        const a = (i / 5) * Math.PI * 2 + t;
        const rr = 8 + t * 18;
        ctx.globalAlpha = 0.5 * (1 - t);
        ctx.beginPath();
        ctx.arc(f.x + Math.cos(a) * rr, f.y + Math.sin(a) * rr - t * 8, 5 * (1 - t * 0.5), 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.restore();
  }
}

function drawGround() {
  const th = map.theme;
  ctx.fillStyle = th.ground;
  ctx.fillRect(0, map.ground, map.width, H - map.ground);
  ctx.fillStyle = th.groundDeep;
  ctx.fillRect(0, map.ground + 16, map.width, H - map.ground - 16);
  ctx.fillStyle = th.groundTop;
  ctx.fillRect(0, map.ground - 4, map.width, 8);

  // Stable per-x terrain detail across the visible strip
  const x0 = Math.floor((camera.x - 30) / 20) * 20;
  const x1 = camera.x + W + 30;
  for (let x = x0; x < x1; x += 20) {
    const r = hash01(x);
    if (currentMapIdx === 0) {
      // Grass tufts + occasional flowers, dirt speckles below
      const gh = 3 + r * 5;
      ctx.fillStyle = r > 0.5 ? '#93d45e' : '#84c452';
      ctx.fillRect(x + r * 12, map.ground - 4 - gh, 2, gh);
      ctx.fillRect(x + r * 12 + 3, map.ground - 4 - gh * 0.6, 2, gh * 0.6);
      if (r > 0.72) {
        ctx.fillStyle = r > 0.88 ? '#ff9ad0' : '#ffe870';
        ctx.fillRect(x + r * 12 + 1, map.ground - 9 - gh, 3, 3);
      }
      ctx.fillStyle = 'rgba(0,0,0,0.12)';
      ctx.fillRect(x + ((r * 37) % 14), map.ground + 22 + r * 70, 4 + r * 5, 3);
    } else if (currentMapIdx === 1) {
      // Embedded stones + cracks
      ctx.fillStyle = 'rgba(255,255,255,0.10)';
      ctx.fillRect(x + r * 10, map.ground + 10 + r * 70, 6 + r * 9, 4);
      ctx.fillStyle = 'rgba(0,0,0,0.16)';
      ctx.fillRect(x + ((r * 53) % 15), map.ground + 34 + ((r * 91) % 55), 6, 3);
      if (r > 0.8) { ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.fillRect(x + 4, map.ground - 2, 1.5, 7 + r * 6); }
    } else {
      // Glowing moss + faint mushroom clusters
      if (r > 0.5) {
        ctx.fillStyle = 'rgba(150,100,255,0.30)';
        ctx.fillRect(x, map.ground - 4, 9 + r * 9, 4);
      }
      if (r > 0.82) {
        ctx.save();
        ctx.shadowBlur = 7; ctx.shadowColor = '#b080ff';
        ctx.fillStyle = '#8a5ae0';
        ctx.fillRect(x + 4, map.ground - 10, 5, 7);
        ctx.fillStyle = '#c8a0ff';
        ctx.fillRect(x + 2, map.ground - 12, 9, 3);
        ctx.restore();
      }
      ctx.fillStyle = 'rgba(160,120,255,0.07)';
      ctx.fillRect(x + r * 8, map.ground + 14 + r * 55, 9, 4);
    }
  }
}

function updateAmbient(dt) {
  const type = map.theme.ambient;
  const step = dt / 16.7;
  if (ambient.length < 24 && Math.random() < 0.25) {
    if (type === 'leaf') {
      ambient.push({ t: 'leaf', x: Math.random() * W, y: -10, vy: 0.5 + Math.random() * 0.6,
        sway: Math.random() * Math.PI * 2, color: ['#7ec850', '#a8d060', '#e8a840', '#d0e070'][Math.floor(Math.random() * 4)] });
    } else if (type === 'dust') {
      ambient.push({ t: 'dust', x: -10, y: 60 + Math.random() * 320, vx: 0.7 + Math.random() * 1.1 });
    } else {
      ambient.push({ t: 'fly', x: Math.random() * W, y: 50 + Math.random() * 330, ph: Math.random() * Math.PI * 2 });
    }
  }
  for (let i = ambient.length - 1; i >= 0; i--) {
    const a = ambient[i];
    if (a.t === 'leaf') {
      a.y += a.vy * step;
      a.sway += 0.035 * step;
      a.x += Math.sin(a.sway) * 0.9;
      if (a.y > H + 12) ambient.splice(i, 1);
    } else if (a.t === 'dust') {
      a.x += a.vx * step;
      a.y += Math.sin(a.x / 40) * 0.35;
      if (a.x > W + 12) ambient.splice(i, 1);
    } else {
      a.ph += 0.02 * step;
      a.x += Math.cos(a.ph) * 0.6;
      a.y += Math.sin(a.ph * 1.7) * 0.4;
      if (a.x < -12 || a.x > W + 12 || a.y < -12) ambient.splice(i, 1);
    }
  }
}

function drawAmbient() {
  for (const a of ambient) {
    ctx.save();
    if (a.t === 'leaf') {
      ctx.translate(a.x, a.y);
      ctx.rotate(Math.sin(a.sway) * 0.9);
      ctx.globalAlpha = 0.85;
      ctx.fillStyle = a.color;
      ctx.fillRect(-3, -2, 6, 4);
    } else if (a.t === 'dust') {
      ctx.globalAlpha = 0.28;
      ctx.fillStyle = '#ecd8a8';
      ctx.fillRect(a.x, a.y, 3, 2);
    } else {
      const pulse = 0.35 + 0.65 * Math.abs(Math.sin(a.ph * 2.3));
      ctx.globalAlpha = pulse * 0.9;
      ctx.shadowBlur = 9; ctx.shadowColor = '#c8ff70';
      ctx.fillStyle = '#e4ff96';
      ctx.beginPath(); ctx.arc(a.x, a.y, 2, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }
}

function drawLighting() {
  // Deep-forest darkness with a pool of light around the player (Ellinia only)
  if (currentMapIdx === 2 && gameState !== 'classselect') {
    const lx = player.x + player.w / 2 - camera.x;
    const ly = player.y + player.h / 2;
    const g = ctx.createRadialGradient(lx, ly, 70, lx, ly, 430);
    g.addColorStop(0, 'rgba(8,4,26,0)');
    g.addColorStop(1, 'rgba(8,4,26,0.55)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }
  // Soft vignette on every map
  const v = ctx.createRadialGradient(W / 2, H / 2, H * 0.45, W / 2, H / 2, H * 0.95);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(10,5,25,0.22)');
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, W, H);
}

function drawBackground() {
  // Sun over Henesys
  if (currentMapIdx === 0) {
    ctx.save();
    ctx.shadowBlur = 34; ctx.shadowColor = '#fff2b0';
    ctx.fillStyle = '#fff0a0';
    ctx.beginPath(); ctx.arc(110, 74, 26, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // Rolling hill silhouettes at two parallax depths
  const th = map.theme;
  const drawHillRow = (color, par, ry, spacing, phase) => {
    ctx.fillStyle = color;
    const off = (camera.x * par) % spacing;
    for (let i = -1; i <= Math.ceil(W / spacing) + 1; i++) {
      const hx = i * spacing - off + phase;
      ctx.beginPath();
      if (currentMapIdx === 1) {
        // Flat-topped mesas for Perion
        ctx.moveTo(hx - spacing * 0.55, map.ground + 2);
        ctx.lineTo(hx - spacing * 0.3, map.ground - ry);
        ctx.lineTo(hx + spacing * 0.3, map.ground - ry);
        ctx.lineTo(hx + spacing * 0.55, map.ground + 2);
        ctx.closePath();
        ctx.fill();
      } else {
        ctx.ellipse(hx, map.ground + 30, spacing * 0.62, ry, 0, Math.PI, 0);
        ctx.fill();
      }
    }
  };
  drawHillRow(th.hillFar, 0.08, 190, 560, 0);
  drawHillRow(th.hillNear, 0.16, 120, 420, 160);

  // Sky layer: clouds by day, stars + moon at night
  if (currentMapIdx === 2) {
    ctx.save();
    for (let i = 0; i < 40; i++) {
      const sx = ((i * 173 + 37) % W);
      const sy = ((i * 97 + 11) % 260);
      const tw = 0.5 + 0.5 * Math.sin(Date.now() / 700 + i * 1.7);
      ctx.globalAlpha = 0.25 + tw * 0.55;
      ctx.fillStyle = i % 5 === 0 ? '#aaccff' : '#ffffff';
      ctx.fillRect(sx, sy, 2, 2);
    }
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 24; ctx.shadowColor = '#e8f0ff';
    ctx.fillStyle = '#e8ecf5';
    ctx.beginPath(); ctx.arc(W - 130, 80, 30, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#1a2a4a';
    ctx.beginPath(); ctx.arc(W - 142, 72, 26, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  } else {
    const drift = Date.now() / 300;
    const cloudPar = camera.x * 0.12;
    ctx.save();
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    for (let i = 0; i < 6; i++) {
      const cw = 90 + (i % 3) * 40;
      const cxx = ((i * 340 + drift - cloudPar) % (W + cw + 100)) - cw - 50 + 0;
      const cyy = 45 + (i % 3) * 42;
      ctx.beginPath();
      ctx.ellipse(cxx + cw / 2, cyy, cw / 2, 16, 0, 0, Math.PI * 2);
      ctx.ellipse(cxx + cw / 3, cyy - 10, cw / 4, 13, 0, 0, Math.PI * 2);
      ctx.ellipse(cxx + cw / 1.5, cyy - 8, cw / 4.5, 11, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  const parallax = camera.x * 0.3;
  for (const t of map.trees) {
    const sx = (t.x - parallax) % (map.width + W);
    if (sx < -80 || sx > W + 80) continue;
    if (t.isRock) {
      // Rocky mountain scenery
      ctx.fillStyle = '#776655';
      ctx.beginPath();
      ctx.moveTo(sx, H - 120);
      ctx.lineTo(sx + 50, H - 220);
      ctx.lineTo(sx + 100, H - 120);
      ctx.fill();
      ctx.fillStyle = '#998877';
      ctx.beginPath();
      ctx.moveTo(sx + 20, H - 120);
      ctx.lineTo(sx + 60, H - 190);
      ctx.lineTo(sx + 90, H - 120);
      ctx.fill();
    } else if (t.isGlow) {
      // Magic glowing trees
      ctx.save();
      ctx.shadowBlur = 20;
      ctx.shadowColor = '#9933ff';
      ctx.fillStyle = '#4a1a7a';
      ctx.fillRect(sx + 22, H - 200, 16, 120);
      ctx.fillStyle = '#7733cc';
      ctx.beginPath();
      ctx.arc(sx + 30, H - 210, 40, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    } else {
      // Normal trees
      ctx.fillStyle = '#5a3a1a';
      ctx.fillRect(sx + 22, H - 180, 16, 100);
      ctx.fillStyle = '#2d6a2d';
      ctx.beginPath();
      ctx.arc(sx + 30, H - 195, 38, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#3a8a3a';
      ctx.beginPath();
      ctx.arc(sx + 30, H - 215, 28, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function drawPlatform(p) {
  const th = map.theme;
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.fillRect(p.x + 4, p.y + 6, p.w, 10);
  // Base
  ctx.fillStyle = th.platBase;
  ctx.fillRect(p.x, p.y + 4, p.w, 10);
  // Top surface
  ctx.fillStyle = th.platTop;
  ctx.fillRect(p.x, p.y, p.w, 8);
  // Highlight
  ctx.fillStyle = shadeColor(th.platTop, 25);
  ctx.fillRect(p.x + 2, p.y, p.w - 4, 3);
  // Edge caps
  ctx.fillStyle = th.platEdge;
  ctx.fillRect(p.x, p.y, 4, 14);
  ctx.fillRect(p.x + p.w - 4, p.y, 4, 14);

  if (currentMapIdx === 0) {
    // Plank seams + grass wisps on top
    ctx.fillStyle = th.platEdge;
    for (let x = p.x + 26; x < p.x + p.w - 8; x += 26) ctx.fillRect(x, p.y + 4, 2, 10);
    ctx.fillStyle = '#8fce5a';
    for (let x = p.x + 8; x < p.x + p.w - 6; x += 22) {
      const r = hash01(x + p.y);
      if (r > 0.4) ctx.fillRect(x + r * 6, p.y - 3 - r * 3, 2, 3 + r * 3);
    }
  } else if (currentMapIdx === 1) {
    // Stone block joints
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    for (let x = p.x + 32; x < p.x + p.w - 10; x += 32) ctx.fillRect(x, p.y + 2, 2, 12);
    ctx.fillStyle = 'rgba(255,255,255,0.14)';
    ctx.fillRect(p.x + 6, p.y + 6, 10, 3);
  } else {
    // Enchanted underglow + hanging vines
    ctx.save();
    ctx.shadowBlur = 10; ctx.shadowColor = '#a070ff';
    ctx.fillStyle = 'rgba(150,100,255,0.5)';
    ctx.fillRect(p.x + 2, p.y + 13, p.w - 4, 2);
    ctx.restore();
    ctx.strokeStyle = 'rgba(120,220,140,0.5)';
    ctx.lineWidth = 2;
    for (let x = p.x + 18; x < p.x + p.w - 10; x += 44) {
      const r = hash01(x * 3 + p.y);
      const len = 8 + r * 14;
      const swing = Math.sin(Date.now() / 600 + x) * 2;
      ctx.beginPath();
      ctx.moveTo(x, p.y + 14);
      ctx.quadraticCurveTo(x + swing, p.y + 14 + len * 0.6, x + swing, p.y + 14 + len);
      ctx.stroke();
    }
  }
}

function drawPortal() {
  const portal = map.portal;
  if (!portal) return;
  const t = Date.now() / 500;
  const glow = Math.sin(t) * 0.3 + 0.7;
  ctx.save();
  ctx.globalAlpha = glow;
  ctx.shadowBlur = 20;
  ctx.shadowColor = '#00FFFF';
  // Portal frame
  ctx.strokeStyle = '#00DDFF';
  ctx.lineWidth = 3;
  ctx.strokeRect(portal.x, portal.y, 30, 60);
  // Inner shimmer
  const pg = ctx.createLinearGradient(portal.x, portal.y, portal.x, portal.y + 60);
  pg.addColorStop(0, 'rgba(0,200,255,0.55)');
  pg.addColorStop(0.5, 'rgba(0,100,200,0.28)');
  pg.addColorStop(1, 'rgba(0,200,255,0.55)');
  ctx.fillStyle = pg;
  ctx.fillRect(portal.x + 3, portal.y + 3, 24, 54);
  // Rotating vortex arcs
  const pcx = portal.x + 15, pcy = portal.y + 30;
  for (let i = 0; i < 3; i++) {
    ctx.strokeStyle = i === 1 ? 'rgba(200,250,255,0.85)' : 'rgba(90,220,255,0.7)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(pcx, pcy, 4 + i * 5, t * 1.4 + i * 2.1, t * 1.4 + i * 2.1 + 2);
    ctx.stroke();
  }
  // Rising motes
  for (let i = 0; i < 4; i++) {
    const my = 55 - ((t * 22 + i * 17) % 60);
    const mx = 6 + hash01(i * 7) * 18;
    ctx.globalAlpha = glow * (1 - my / 60);
    ctx.fillStyle = '#bff4ff';
    ctx.fillRect(portal.x + mx, portal.y + my, 2, 2);
  }
  ctx.globalAlpha = glow;
  // Label
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#00FFFF';
  ctx.font = '10px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('NEXT', portal.x + 15, portal.y - 6);
  ctx.restore();
}

function drawPlayer() {
  const px = player.x, py = player.y, d = player.dir;
  const blink = player.invincible > 0 && Math.floor(Date.now() / 80) % 2 === 0;
  if (blink) return;
  const c = player.cls;
  const skin = '#ffdfc4';
  const atk = player.attacking;

  // Back-facing climbing pose
  if (player.state === 'climb') {
    const swing = Math.sin(player.animFrame * Math.PI / 2) * 3;
    ctx.save();
    // Legs
    ctx.fillStyle = '#3a3550';
    ctx.fillRect(px + 8, py + 33, 6, 7 + swing);
    ctx.fillRect(px + 16, py + 33, 6, 7 - swing);
    // Body
    ctx.fillStyle = c.color;
    ctx.fillRect(px + 8, py + 22, 14, 12);
    // Arms reaching up, alternating
    ctx.fillStyle = skin;
    ctx.fillRect(px + 7, py + 12 - swing, 5, 12);
    ctx.fillRect(px + 18, py + 12 + swing, 5, 12);
    // Back of head (hair only, no face)
    ctx.fillStyle = skin;
    ctx.fillRect(px + 6, py + 4, 18, 17);
    ctx.fillStyle = c.hair;
    ctx.fillRect(px + 5, py + 2, 20, 14);
    ctx.restore();
    return;
  }

  ctx.save();
  if (d < 0) {
    ctx.translate(px + player.w / 2, 0);
    ctx.scale(-1, 1);
    ctx.translate(-(px + player.w / 2), 0);
  }

  const walk = player.state === 'walk';
  const f = player.animFrame;
  const legOff = walk ? Math.sin(f * Math.PI / 2) * 4 : 0;

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.28)';
  ctx.beginPath();
  ctx.ellipse(px + 15, map.ground + 2, 15, 4, 0, 0, Math.PI * 2);
  ctx.fill();

  // Rage aura
  if (player.buffTimer > 0) {
    ctx.save();
    ctx.globalAlpha = 0.3 + Math.sin(Date.now() / 100) * 0.15;
    ctx.shadowBlur = 16; ctx.shadowColor = '#ff3030';
    ctx.fillStyle = 'rgba(255,60,40,0.25)';
    ctx.beginPath();
    ctx.ellipse(px + 15, py + 24, 21, 27, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // Legs (tucked when airborne)
  const inAir = player.state === 'jump';
  ctx.fillStyle = '#3a3550';
  if (inAir) {
    ctx.fillRect(px + 8, py + 33, 6, 5);
    ctx.fillRect(px + 17, py + 32, 6, 6);
    ctx.fillStyle = '#7a4420';
    ctx.fillRect(px + 6, py + 37, 8, 3);
    ctx.fillRect(px + 17, py + 37, 8, 3);
  } else {
    ctx.fillRect(px + 8, py + 33, 6, 7 + legOff);
    ctx.fillRect(px + 16, py + 33, 6, 7 - legOff);
    ctx.fillStyle = '#7a4420';
    ctx.fillRect(px + 7, py + 39 + legOff, 8, 3);
    ctx.fillRect(px + 15, py + 39 - legOff, 8, 3);
  }

  // Idle breathing: torso and head bob together, feet stay planted
  const bob = player.state === 'idle' ? Math.round(Math.sin(Date.now() / 420) * 1.2) : 0;
  ctx.translate(0, bob);

  // Cape (warrior only), flapping with movement
  if (c.id === 'warrior') {
    const flap = walk ? Math.sin(Date.now() / 110) * 3.5 : Math.sin(Date.now() / 520) * 1.5;
    ctx.fillStyle = '#8a1f28';
    ctx.beginPath();
    ctx.moveTo(px + 9, py + 22);
    ctx.lineTo(px + 1 - flap, py + 37 + flap * 0.6);
    ctx.lineTo(px + 9, py + 33);
    ctx.closePath();
    ctx.fill();
  }

  // Back arm (swings opposite the front leg)
  ctx.fillStyle = skin;
  ctx.fillRect(px + 5, py + 23 + (walk ? legOff * 0.5 : 0), 5, 9);

  // Body / robe
  ctx.fillStyle = c.color;
  if (c.id === 'magician') {
    ctx.beginPath();
    ctx.moveTo(px + 8, py + 22);
    ctx.lineTo(px + 22, py + 22);
    ctx.lineTo(px + 25, py + 35);
    ctx.lineTo(px + 5, py + 35);
    ctx.closePath();
    ctx.fill();
  } else {
    ctx.fillRect(px + 8, py + 22, 14, 12);
    if (c.id === 'warrior') {
      ctx.fillStyle = shadeColor(c.color, 25);
      ctx.fillRect(px + 6, py + 22, 4, 5);
      ctx.fillRect(px + 20, py + 22, 4, 5);
    }
  }
  // Trim + belt
  ctx.fillStyle = c.trim;
  ctx.fillRect(px + 14, py + 22, 2, 12);
  ctx.fillStyle = '#5a3a1a';
  ctx.fillRect(px + 8, py + 31, 14, 2);

  // Head
  ctx.fillStyle = skin;
  ctx.fillRect(px + 6, py + 4, 18, 17);
  ctx.fillRect(px + 5, py + 12, 2, 4); // ear
  // Big expressive eyes, with a periodic blink
  const blinkEye = (Date.now() % 3400) < 130;
  if (blinkEye) {
    ctx.fillStyle = '#3a2a4a';
    ctx.fillRect(px + 11, py + 13, 3, 1.5);
    ctx.fillRect(px + 18, py + 13, 3, 1.5);
  } else {
    ctx.fillStyle = '#fff';
    ctx.fillRect(px + 11, py + 10, 3, 5);
    ctx.fillRect(px + 18, py + 10, 3, 5);
    ctx.fillStyle = '#3a2a4a';
    ctx.fillRect(px + 12, py + 11, 2, 4);
    ctx.fillRect(px + 19, py + 11, 2, 4);
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.fillRect(px + 12, py + 11, 1, 1);
    ctx.fillRect(px + 19, py + 11, 1, 1);
  }
  ctx.fillStyle = '#c06050';
  ctx.fillRect(px + 14, py + 17, 4, 1);

  // Hair base
  ctx.fillStyle = c.hair;
  ctx.fillRect(px + 5, py + 2, 20, 6);
  ctx.fillRect(px + 5, py + 4, 4, 8);

  // Class headgear
  if (c.id === 'warrior') {
    ctx.fillStyle = '#b8b8c0';
    ctx.fillRect(px + 5, py, 20, 7);
    ctx.fillStyle = c.trim;
    ctx.fillRect(px + 5, py + 6, 20, 2);
    ctx.fillStyle = '#d04040';
    ctx.fillRect(px + 13, py - 4, 4, 6);
  } else if (c.id === 'magician') {
    ctx.fillStyle = c.color;
    ctx.beginPath();
    ctx.moveTo(px + 3, py + 4);
    ctx.lineTo(px + 27, py + 4);
    ctx.lineTo(px + 17, py - 12);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = c.trim;
    ctx.fillRect(px + 3, py + 3, 24, 3);
    ctx.fillStyle = '#ffe84a';
    ctx.fillRect(px + 14, py - 6, 3, 3);
  } else {
    ctx.fillStyle = c.color;
    ctx.fillRect(px + 5, py, 20, 6);
    ctx.fillStyle = c.trim;
    ctx.fillRect(px + 5, py + 5, 20, 2);
    ctx.fillStyle = '#e0e060';
    ctx.beginPath();
    ctx.moveTo(px + 22, py + 1);
    ctx.lineTo(px + 34, py - 6);
    ctx.lineTo(px + 24, py + 4);
    ctx.closePath();
    ctx.fill();
  }

  // Front arm + weapon
  drawWeapon(px, py, c, atk, skin);

  ctx.restore();
}

function drawWeapon(px, py, c, atk, skin) {
  const armY = py + 23;
  if (c.weapon === 'sword') {
    if (atk) {
      ctx.fillStyle = skin;
      ctx.fillRect(px + 22, py + 20, 12, 5);
      ctx.save();
      ctx.translate(px + 32, py + 14);
      ctx.fillStyle = '#dfe6ef';
      ctx.fillRect(0, -2, 22, 5);
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, -2, 22, 2);
      ctx.fillStyle = c.trim;
      ctx.fillRect(-4, -4, 4, 9);
      ctx.fillStyle = '#5a3a1a';
      ctx.fillRect(-8, -2, 5, 5);
      ctx.restore();
    } else {
      ctx.fillStyle = skin;
      ctx.fillRect(px + 21, armY, 6, 9);
      ctx.fillStyle = '#dfe6ef';
      ctx.fillRect(px + 24, py + 4, 4, 22);
      ctx.fillStyle = c.trim;
      ctx.fillRect(px + 22, py + 24, 8, 3);
    }
  } else if (c.weapon === 'staff') {
    ctx.fillStyle = skin;
    ctx.fillRect(px + 21, armY, 6, 9);
    ctx.fillStyle = '#7a5a2a';
    ctx.fillRect(px + 25, py + 2, 3, 30);
    const t = Date.now() / 200;
    ctx.save();
    ctx.shadowBlur = 10; ctx.shadowColor = c.trim;
    ctx.fillStyle = c.trim;
    ctx.beginPath();
    ctx.arc(px + 26, py + 1, 4 + Math.sin(t) * 0.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    if (atk) { ctx.fillStyle = skin; ctx.fillRect(px + 24, py + 21, 10, 5); }
  } else { // bow
    ctx.fillStyle = skin;
    ctx.fillRect(px + 21, armY, 6, 9);
    ctx.strokeStyle = '#8a5a2a';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(px + 30, py + 18, 13, -Math.PI / 2.2, Math.PI / 2.2);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.6)';
    ctx.lineWidth = 1;
    const a1 = -Math.PI / 2.2, a2 = Math.PI / 2.2;
    ctx.beginPath();
    ctx.moveTo(px + 30 + 13 * Math.cos(a1), py + 18 + 13 * Math.sin(a1));
    ctx.lineTo(px + 30 + 13 * Math.cos(a2), py + 18 + 13 * Math.sin(a2));
    ctx.stroke();
    if (atk) { ctx.fillStyle = skin; ctx.fillRect(px + 22, py + 20, 10, 5); }
  }
}

function drawEnemy(e) {
  const blink = e.hitFlash > 0 && Math.floor(Date.now() / 60) % 2 === 0;
  const alpha = blink ? 0.4 : 1;
  ctx.save();
  ctx.globalAlpha = alpha;

  const anim = e.animFrame;
  const legOff = Math.sin(anim * Math.PI / 2) * 3;

  if (e.dir < 0) {
    ctx.translate(e.x + e.w / 2, e.y);
    ctx.scale(-1, 1);
    ctx.translate(-(e.x + e.w / 2), -e.y);
  }

  // Shadow
  ctx.globalAlpha = alpha * 0.3;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(e.x + e.w / 2, map.ground + 2, 14, 4, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = alpha;

  // Body (distinct per enemy type)
  const baseColor = e.color;
  const darkColor = shadeColor(baseColor, -35);
  const liteColor = shadeColor(baseColor, 30);
  const n = e.name;
  const ex = e.x, ey = e.y, cx = e.x + e.w / 2;

  function eyes(lx, rx, yy, sz) {
    ctx.fillStyle = '#fff';
    ctx.fillRect(ex + lx, ey + yy, sz, sz + 1);
    ctx.fillRect(ex + rx, ey + yy, sz, sz + 1);
    ctx.fillStyle = '#000';
    ctx.fillRect(ex + lx + 1, ey + yy + 1, 2, 3);
    ctx.fillRect(ex + rx + 1, ey + yy + 1, 2, 3);
  }

  if (n.includes('Snail')) {
    // Foot
    ctx.fillStyle = '#f0e0b0';
    ctx.fillRect(ex + 2, ey + 24, 30, 10 + legOff);
    ctx.fillRect(ex, ey + 28, 4, 4); // tail
    // Shell
    ctx.fillStyle = baseColor;
    ctx.beginPath(); ctx.arc(ex + 22, ey + 18, 13, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = darkColor;
    ctx.beginPath(); ctx.arc(ex + 24, ey + 19, 8, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = liteColor;
    ctx.beginPath(); ctx.arc(ex + 26, ey + 20, 3, 0, Math.PI * 2); ctx.fill();
    // Head + eyestalks
    ctx.fillStyle = '#f0e0b0';
    ctx.fillRect(ex + 2, ey + 20, 10, 12);
    ctx.fillRect(ex + 3, ey + 14, 2, 7);
    ctx.fillRect(ex + 9, ey + 14, 2, 7);
    ctx.fillStyle = '#000';
    ctx.fillRect(ex + 2, ey + 12, 4, 4);
    ctx.fillRect(ex + 8, ey + 12, 4, 4);
  } else if (n.includes('Mushroom') || n.includes('Shroom')) {
    const zombie = n.includes('Zombie');
    // Stem
    ctx.fillStyle = zombie ? '#cfe0c0' : '#f2e2c2';
    ctx.fillRect(ex + 9, ey + 18, 18, 18);
    // Cap
    ctx.fillStyle = baseColor;
    ctx.beginPath(); ctx.arc(cx, ey + 18, 18, Math.PI, 0); ctx.fill();
    ctx.fillRect(ex + 0, ey + 16, 36, 4);
    // Spots
    ctx.fillStyle = zombie ? '#2a3a2a' : '#fff';
    ctx.fillRect(ex + 6, ey + 8, 5, 5);
    ctx.fillRect(ex + 16, ey + 4, 6, 6);
    ctx.fillRect(ex + 26, ey + 9, 5, 5);
    // Face
    eyes(10, 22, 22, 4);
    ctx.fillStyle = zombie ? '#702020' : '#a05030';
    ctx.fillRect(ex + 15, ey + 30, 6, 2);
    if (zombie) { ctx.fillStyle = '#3a5a3a'; ctx.fillRect(ex + 12, ey + 33, 3, 4); ctx.fillRect(ex + 21, ey + 33, 3, 4); }
  } else if (n.includes('Slime')) {
    ctx.fillStyle = baseColor;
    ctx.beginPath(); ctx.ellipse(cx, ey + 22, 17, 15 + legOff, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = liteColor;
    ctx.beginPath(); ctx.ellipse(cx - 4, ey + 16, 5, 6, 0, 0, Math.PI * 2); ctx.fill();
    eyes(9, 21, 16, 5);
    ctx.fillStyle = '#000';
    ctx.fillRect(ex + 13, ey + 26, 10, 2);
  } else if (n.includes('Boar') || n.includes('Pig')) {
    const fire = n.includes('Fire');
    // Body
    ctx.fillStyle = baseColor;
    ctx.beginPath(); ctx.ellipse(cx, ey + 22, 17, 12, 0, 0, Math.PI * 2); ctx.fill();
    // Snout
    ctx.fillStyle = liteColor;
    ctx.fillRect(ex + 26, ey + 18, 9, 8);
    ctx.fillStyle = darkColor;
    ctx.fillRect(ex + 28, ey + 20, 2, 4);
    ctx.fillRect(ex + 32, ey + 20, 2, 4);
    // Ear
    ctx.fillStyle = baseColor;
    ctx.beginPath(); ctx.moveTo(ex + 18, ey + 10); ctx.lineTo(ex + 24, ey + 16); ctx.lineTo(ex + 14, ey + 16); ctx.fill();
    // Eye
    ctx.fillStyle = '#fff'; ctx.fillRect(ex + 22, ey + 14, 4, 4);
    ctx.fillStyle = '#000'; ctx.fillRect(ex + 23, ey + 15, 2, 2);
    // Tusk
    ctx.fillStyle = '#fff'; ctx.fillRect(ex + 27, ey + 25, 4, 2);
    // Legs
    ctx.fillStyle = darkColor;
    ctx.fillRect(ex + 8, ey + 30 + legOff, 5, 7);
    ctx.fillRect(ex + 22, ey + 30 - legOff, 5, 7);
    if (fire) { // flame mane
      ctx.fillStyle = 'rgba(255,140,40,0.8)';
      for (let i = 0; i < 4; i++) ctx.fillRect(ex + 4 + i * 6, ey + 8 - (i % 2) * 3, 4, 8);
    }
  } else if (n.includes('Stump')) {
    const dark = n.includes('Dark');
    // Trunk
    ctx.fillStyle = baseColor;
    ctx.fillRect(ex + 6, ey + 12, 24, 24);
    ctx.fillStyle = darkColor;
    ctx.fillRect(ex + 6, ey + 12, 24, 4); // top rim
    // Rings
    ctx.fillStyle = liteColor;
    ctx.fillRect(ex + 12, ey + 13, 12, 2);
    // Bark lines
    ctx.fillStyle = darkColor;
    ctx.fillRect(ex + 12, ey + 18, 2, 16);
    ctx.fillRect(ex + 22, ey + 18, 2, 16);
    // Angry face
    ctx.fillStyle = '#000';
    ctx.fillRect(ex + 11, ey + 22, 4, 3);
    ctx.fillRect(ex + 21, ey + 22, 4, 3);
    ctx.fillRect(ex + 13, ey + 29, 10, 2);
    if (!dark) { // little legs
      ctx.fillStyle = darkColor;
      ctx.fillRect(ex + 9, ey + 35 + legOff, 5, 5);
      ctx.fillRect(ex + 22, ey + 35 - legOff, 5, 5);
    } else { // axe
      ctx.fillStyle = '#aaa'; ctx.fillRect(ex + 28, ey + 6, 8, 4);
      ctx.fillStyle = '#7a5a2a'; ctx.fillRect(ex + 30, ey + 8, 2, 14);
    }
  } else if (n.includes('Eye')) {
    const curse = n.includes('Curse');
    // Floating body
    ctx.fillStyle = baseColor;
    ctx.beginPath(); ctx.ellipse(cx, ey + 20 + Math.sin(Date.now() / 300) * 2, 15, 16, 0, 0, Math.PI * 2); ctx.fill();
    // Big eye
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(cx, ey + 20, 9, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = curse ? '#cc2020' : '#9020c0';
    ctx.beginPath(); ctx.arc(cx + e.dir * 2, ey + 20, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(cx + e.dir * 2, ey + 20, 2, 0, Math.PI * 2); ctx.fill();
    // Tendrils
    ctx.strokeStyle = darkColor; ctx.lineWidth = 2;
    for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.moveTo(cx + i * 8, ey + 33); ctx.lineTo(cx + i * 10, ey + 38); ctx.stroke(); }
  } else if (n.includes('Necki')) {
    // Snake
    ctx.fillStyle = baseColor;
    ctx.fillRect(ex + 6, ey + 22, 24, 14); // coil base
    ctx.beginPath(); ctx.arc(ex + 24, ey + 14, 10, 0, Math.PI * 2); ctx.fill(); // head
    ctx.fillStyle = liteColor;
    ctx.fillRect(ex + 8, ey + 26, 20, 3);
    ctx.fillStyle = '#fff'; ctx.fillRect(ex + 24, ey + 11, 4, 4);
    ctx.fillStyle = '#000'; ctx.fillRect(ex + 25, ey + 12, 2, 2);
    ctx.fillStyle = '#c02020'; ctx.fillRect(ex + 30, ey + 16, 5, 2); // tongue
  } else if (n.includes('Golem')) {
    ctx.fillStyle = baseColor;
    ctx.fillRect(ex + 4, ey + 8, 28, 28);
    ctx.fillStyle = darkColor;
    ctx.fillRect(ex + 4, ey + 8, 28, 3);
    ctx.fillRect(ex + 16, ey + 8, 3, 28);
    ctx.fillRect(ex + 4, ey + 22, 28, 3);
    ctx.fillStyle = liteColor; ctx.fillRect(ex + 7, ey + 11, 6, 6);
    eyes(9, 21, 14, 5);
    ctx.fillStyle = darkColor;
    ctx.fillRect(ex + 0, ey + 14, 6, 12); // arms
    ctx.fillRect(ex + 30, ey + 14, 6, 12);
  } else if (n.includes('Wraith') || n.includes('Balrog')) {
    const balrog = n.includes('Balrog');
    // Ghostly cloak
    ctx.globalAlpha = alpha * (balrog ? 1 : 0.85);
    ctx.fillStyle = baseColor;
    ctx.beginPath();
    ctx.moveTo(ex + 4, ey + 8);
    ctx.lineTo(ex + 32, ey + 8);
    ctx.lineTo(ex + 30, ey + 36);
    ctx.lineTo(ex + 24, ey + 30);
    ctx.lineTo(ex + 18, ey + 36);
    ctx.lineTo(ex + 12, ey + 30);
    ctx.lineTo(ex + 6, ey + 36);
    ctx.closePath(); ctx.fill();
    // Hood face
    ctx.fillStyle = '#000';
    ctx.fillRect(ex + 10, ey + 10, 16, 12);
    ctx.fillStyle = balrog ? '#ff3020' : '#90e0ff';
    ctx.fillRect(ex + 13, ey + 14, 4, 4);
    ctx.fillRect(ex + 19, ey + 14, 4, 4);
    ctx.globalAlpha = alpha;
    if (balrog) { // horns
      ctx.fillStyle = '#1a1a1a';
      ctx.beginPath(); ctx.moveTo(ex + 6, ey + 8); ctx.lineTo(ex + 2, ey - 4); ctx.lineTo(ex + 12, ey + 6); ctx.fill();
      ctx.beginPath(); ctx.moveTo(ex + 30, ey + 8); ctx.lineTo(ex + 34, ey - 4); ctx.lineTo(ex + 24, ey + 6); ctx.fill();
    }
  } else {
    // Generic critter
    ctx.fillStyle = baseColor;
    ctx.fillRect(ex + 4, ey + 8, 28, 24);
    eyes(9, 21, 14, 5);
    ctx.fillStyle = darkColor;
    ctx.fillRect(ex + 6, ey + 30 + legOff, 8, 7);
    ctx.fillRect(ex + 22, ey + 30 - legOff, 8, 7);
  }

  ctx.restore();

  // HP bar above enemy — only once it's been damaged
  if (e.hp < e.maxHp) {
    const barW = e.w + 10;
    const barX = e.x - 5;
    const barY = e.y - 13;
    ctx.fillStyle = 'rgba(20,0,0,0.85)';
    roundRect(ctx, barX - 1, barY - 1, barW + 2, 7, 3);
    ctx.fill();
    const pct = Math.max(0, e.hp / e.maxHp);
    const hg = ctx.createLinearGradient(barX, 0, barX + barW, 0);
    hg.addColorStop(0, '#e02020');
    hg.addColorStop(1, '#ff7050');
    ctx.fillStyle = hg;
    if (pct > 0) { roundRect(ctx, barX, barY, Math.max(3, barW * pct), 5, 2); ctx.fill(); }
  }

  // Name chip
  ctx.font = '9px monospace';
  const nw = ctx.measureText(e.name).width + 8;
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  roundRect(ctx, e.x + e.w / 2 - nw / 2, e.y - 26, nw, 12, 3);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.fillText(e.name, e.x + e.w / 2, e.y - 17);
}

function drawDrop(d) {
  const pulse = Math.sin(d.glowPhase) * 0.3 + 0.7;
  const hover = Math.sin(d.glowPhase * 0.7) * 2;
  ctx.save();
  ctx.globalAlpha = Math.min(d.life / 60, 1) * pulse;
  ctx.shadowBlur = 8;
  ctx.shadowColor = d.color;
  if (d.isMeso) {
    // Spinning gold coin
    const spin = Math.abs(Math.cos(d.glowPhase * 0.8));
    ctx.fillStyle = '#c8971e';
    ctx.beginPath();
    ctx.ellipse(d.x, d.y + hover, 6 * Math.max(spin, 0.18), 6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#FFD700';
    ctx.beginPath();
    ctx.ellipse(d.x - 1, d.y - 1 + hover, 5 * Math.max(spin, 0.15), 5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff6c0';
    ctx.fillRect(d.x - 2, d.y - 3 + hover, 1.5, 2);
  } else {
    // Real item icon, hovering
    drawItemIcon(d, d.x - 10, d.y - 10 + hover, 20);
    // Twinkle sparkle
    const tw = (Math.sin(d.glowPhase * 1.6) + 1) / 2;
    if (tw > 0.7) {
      ctx.strokeStyle = 'rgba(255,255,255,0.9)';
      ctx.lineWidth = 1;
      const sx = d.x + 8, sy = d.y - 8 + hover, sr = 3 * (tw - 0.7) / 0.3;
      ctx.beginPath();
      ctx.moveTo(sx - sr, sy); ctx.lineTo(sx + sr, sy);
      ctx.moveTo(sx, sy - sr); ctx.lineTo(sx, sy + sr);
      ctx.stroke();
    }
  }
  ctx.restore();
  // Label
  ctx.save();
  ctx.globalAlpha = Math.min(d.life / 60, 1);
  ctx.fillStyle = '#fff';
  ctx.font = '8px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(d.isMeso ? `${d.value}` : d.name, d.x, d.y - 12);
  ctx.restore();
}

function drawParticles() {
  for (const p of particles) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.life);
    if (p.type === 'text') {
      const isCrit = typeof p.text === 'string' && p.text.startsWith('CRIT');
      // Pop in slightly larger, settle as it fades
      const pop = 1 + Math.max(0, p.life - 0.85) * 2.5;
      ctx.font = `bold ${Math.round((isCrit ? 17 : 14) * pop)}px monospace`;
      ctx.textAlign = 'center';
      ctx.lineWidth = 3;
      ctx.strokeStyle = 'rgba(0,0,0,0.75)';
      ctx.strokeText(p.text, p.x, p.y);
      ctx.fillStyle = p.color;
      ctx.shadowBlur = isCrit ? 10 : 6;
      ctx.shadowColor = p.color;
      ctx.fillText(p.text, p.x, p.y);
    } else {
      ctx.fillStyle = p.color;
      ctx.shadowBlur = 4;
      ctx.shadowColor = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, (p.size / 2) * Math.max(0.2, p.life), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }
}

function drawItemIcon(item, x, y, size) {
  const cx = x + size / 2, cy = y + size / 2;
  ctx.save();
  ctx.shadowBlur = 6; ctx.shadowColor = item.color;
  if (item.healHp || item.healMp) {
    // Potion bottle
    const bw = Math.max(4, Math.round(size * 0.34)), bh = Math.max(5, Math.round(size * 0.52));
    const bx = cx - bw / 2, by = cy - bh / 2 + 3;
    ctx.fillStyle = item.color;
    roundRect(ctx, bx, by, bw, bh, 2); ctx.fill();
    ctx.fillStyle = shadeColor(item.color, -30);
    ctx.fillRect(cx - bw * 0.22, by - bh * 0.18, bw * 0.44, bh * 0.18);
    ctx.fillStyle = '#c87a30';
    ctx.fillRect(cx - bw * 0.18, by - bh * 0.26, bw * 0.36, Math.max(2, bh * 0.1));
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fillRect(bx + 2, by + 3, Math.max(2, Math.round(bw * 0.28)), Math.max(2, Math.round(bh * 0.36)));
  } else if (item.stat === 'atk') {
    // Sword
    const sh = Math.round(size * 0.68);
    ctx.fillStyle = '#c8d0e0';
    ctx.fillRect(cx - 2, cy - sh * 0.55, 4, sh);
    ctx.fillStyle = item.color;
    ctx.fillRect(cx - size * 0.25, cy - 1, size * 0.5, 4);
    ctx.fillStyle = '#6a3a18';
    ctx.fillRect(cx - 2, cy + 3, 4, Math.round(size * 0.2));
    ctx.fillStyle = '#e8f0ff';
    ctx.beginPath();
    ctx.moveTo(cx - 2, cy - sh * 0.55);
    ctx.lineTo(cx + 2, cy - sh * 0.55);
    ctx.lineTo(cx, cy - sh * 0.55 - 5);
    ctx.fill();
  } else if (item.stat === 'spd') {
    // Shoe
    const sw = Math.round(size * 0.52);
    ctx.fillStyle = item.color;
    ctx.fillRect(cx - sw * 0.5, cy + size * 0.06, sw, Math.round(size * 0.26));
    ctx.beginPath();
    ctx.arc(cx - sw * 0.07, cy + size * 0.06, sw * 0.44, Math.PI, 0);
    ctx.fill();
    ctx.fillStyle = shadeColor(item.color, 30);
    ctx.fillRect(cx - sw * 0.28, cy - size * 0.15, sw * 0.26, Math.round(size * 0.18));
  }
  ctx.restore();
}

function drawEquipSlot(label, item, x, y, w, h) {
  ctx.fillStyle = item ? 'rgba(50,28,95,0.75)' : 'rgba(18,8,42,0.75)';
  roundRect(ctx, x, y, w, h, 4); ctx.fill();
  ctx.strokeStyle = item ? '#9060dd' : '#3a2060';
  ctx.lineWidth = 1;
  roundRect(ctx, x, y, w, h, 4); ctx.stroke();
  ctx.fillStyle = '#888'; ctx.font = '9px monospace'; ctx.textAlign = 'center';
  ctx.fillText(label, x + w / 2, y + 12);
  if (item) {
    drawItemIcon(item, x + w / 2 - 20, y + 14, 40);
    ctx.fillStyle = item.color; ctx.font = 'bold 10px monospace'; ctx.textAlign = 'center';
    ctx.fillText(`+${item.statVal} ${item.stat.toUpperCase()}`, x + w / 2, y + h - 5);
  } else {
    ctx.fillStyle = '#444'; ctx.font = '11px monospace'; ctx.textAlign = 'center';
    ctx.fillText('[ Empty ]', x + w / 2, y + h / 2 + 4);
  }
}

function drawInventory() {
  if (!inventoryOpen) return;
  const PW = 480, PH = 340, PX = W / 2 - 240, PY = H / 2 - 170;

  // Dim overlay
  ctx.fillStyle = 'rgba(0,0,0,0.58)';
  ctx.fillRect(0, 0, W, H);

  // Panel
  ctx.fillStyle = 'rgba(12,5,28,0.97)';
  roundRect(ctx, PX, PY, PW, PH, 10); ctx.fill();
  ctx.strokeStyle = '#6030a0'; ctx.lineWidth = 2;
  roundRect(ctx, PX, PY, PW, PH, 10); ctx.stroke();

  // Title bar
  ctx.fillStyle = 'rgba(45,18,90,0.92)';
  roundRect(ctx, PX + 2, PY + 2, PW - 4, 34, 8); ctx.fill();
  ctx.fillStyle = '#FFD700'; ctx.font = 'bold 14px monospace'; ctx.textAlign = 'left';
  ctx.fillText('INVENTORY', PX + 14, PY + 23);
  ctx.fillStyle = '#aaa'; ctx.font = '11px monospace'; ctx.textAlign = 'right';
  ctx.fillText(`${player.inventory.length}/20`, PX + PW - 42, PY + 23);

  // Close ✕
  ctx.fillStyle = '#7a2020';
  roundRect(ctx, PX + PW - 32, PY + 7, 24, 22, 4); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 16px monospace'; ctx.textAlign = 'center';
  ctx.fillText('✕', PX + PW - 20, PY + 22);

  // Item grid (5 cols × 4 rows)
  const SLOT = 52, GAP = 4, GX = PX + 16, GY = PY + 44;
  for (let row = 0; row < 4; row++) {
    for (let col = 0; col < 5; col++) {
      const idx = row * 5 + col;
      const sx = GX + col * (SLOT + GAP), sy = GY + row * (SLOT + GAP);
      const item = player.inventory[idx];
      const sel = idx === inventorySelectedSlot;
      ctx.fillStyle = sel ? 'rgba(90,50,180,0.55)' : 'rgba(22,10,48,0.85)';
      roundRect(ctx, sx, sy, SLOT, SLOT, 4); ctx.fill();
      ctx.strokeStyle = sel ? '#c090ff' : (item ? '#5a3a9a' : '#2e1660');
      ctx.lineWidth = sel ? 2 : 1;
      roundRect(ctx, sx, sy, SLOT, SLOT, 4); ctx.stroke();
      if (item) {
        drawItemIcon(item, sx + 3, sy + 3, SLOT - 6);
        if ((item.qty || 1) > 1) {
          ctx.fillStyle = 'rgba(0,0,0,0.75)';
          ctx.fillRect(sx + SLOT - 20, sy + SLOT - 15, 18, 13);
          ctx.fillStyle = '#ffd700';
          ctx.font = 'bold 10px monospace';
          ctx.textAlign = 'right';
          ctx.fillText(`×${item.qty}`, sx + SLOT - 3, sy + SLOT - 5);
        }
      }
    }
  }

  // Equipment panel (right side)
  const EQX = PX + 300, EQY = PY + 44;
  ctx.fillStyle = 'rgba(16,7,38,0.93)';
  roundRect(ctx, EQX, EQY, 164, 220, 6); ctx.fill();
  ctx.strokeStyle = '#4828a0'; ctx.lineWidth = 1;
  roundRect(ctx, EQX, EQY, 164, 220, 6); ctx.stroke();
  ctx.fillStyle = '#bb88ff'; ctx.font = 'bold 11px monospace'; ctx.textAlign = 'center';
  ctx.fillText('EQUIPMENT', EQX + 82, EQY + 16);

  drawEquipSlot('Weapon', player.equip.weapon, EQX + 10, EQY + 24, 144, 72);
  drawEquipSlot('Shoes', player.equip.shoes, EQX + 10, EQY + 106, 144, 72);

  const bAtk = player.equip.weapon ? player.equip.weapon.statVal : 0;
  const bSpd = player.equip.shoes ? player.equip.shoes.statVal : 0;
  ctx.fillStyle = '#888'; ctx.font = '10px monospace'; ctx.textAlign = 'center';
  ctx.fillText(`Bonus ATK: +${bAtk}`, EQX + 82, EQY + 192);
  ctx.fillText(`Bonus SPD: +${bSpd}`, EQX + 82, EQY + 208);

  // Selected item info strip
  const INFO_Y = PY + 276;
  ctx.fillStyle = 'rgba(16,7,38,0.88)';
  roundRect(ctx, PX + 16, INFO_Y, PW - 32, 52, 4); ctx.fill();
  ctx.strokeStyle = '#3a1880'; ctx.lineWidth = 1;
  roundRect(ctx, PX + 16, INFO_Y, PW - 32, 52, 4); ctx.stroke();

  const sit = inventorySelectedSlot >= 0 ? player.inventory[inventorySelectedSlot] : null;
  if (sit) {
    ctx.fillStyle = sit.color; ctx.font = 'bold 12px monospace'; ctx.textAlign = 'left';
    ctx.fillText(sit.name, PX + 26, INFO_Y + 16);
    ctx.fillStyle = '#bbb'; ctx.font = '10px monospace';
    let desc;
    if (sit.isEquip) {
      desc = `${sit.stat === 'atk' ? 'ATK' : 'SPD'} +${sit.statVal}  ·  tap slot again to equip`;
    } else {
      const parts = [];
      if (sit.healHp) parts.push(`HP+${sit.healHp}`);
      if (sit.healMp) parts.push(`MP+${sit.healMp}`);
