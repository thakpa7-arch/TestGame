      desc = parts.join('  ') + '  ·  tap slot again to use';
    }
    ctx.fillText(desc, PX + 26, INFO_Y + 32);
    // Action button
    ctx.fillStyle = sit.isEquip ? '#4828a0' : '#8a2020';
    roundRect(ctx, PX + PW - 120, INFO_Y + 12, 88, 28, 4); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 11px monospace'; ctx.textAlign = 'center';
    ctx.fillText(sit.isEquip ? 'EQUIP' : 'USE', PX + PW - 76, INFO_Y + 30);
  } else {
    ctx.fillStyle = '#555'; ctx.font = '10px monospace'; ctx.textAlign = 'center';
    ctx.fillText('Tap a slot to select  ·  tap again or press USE to use/equip  ·  F to pick up drops', PX + PW / 2, INFO_Y + 28);
  }

  ctx.fillStyle = '#444'; ctx.font = '9px monospace'; ctx.textAlign = 'center';
  ctx.fillText('[I] or [✕] to close', PX + PW / 2, PY + PH - 7);
}

function drawHUD() {
  // Background panel
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  roundRect(ctx, 8, 8, 250, 80, 8);
  ctx.fill();
  ctx.strokeStyle = '#4a2a7a';
  ctx.lineWidth = 1.5;
  roundRect(ctx, 8, 8, 250, 80, 8);
  ctx.stroke();

  // Character name & level
  ctx.fillStyle = '#FFD700';
  ctx.font = 'bold 14px monospace';
  ctx.textAlign = 'left';
  ctx.fillText(`Lv.${player.level} ${player.cls.name}`, 18, 28);

  // HP bar
  const hpPct = player.hp / player.maxHp;
  ctx.fillStyle = '#330000';
  ctx.fillRect(18, 34, 200, 12);
  const hpGrad = ctx.createLinearGradient(18, 0, 218, 0);
  hpGrad.addColorStop(0, '#cc0000');
  hpGrad.addColorStop(1, '#ff4444');
  ctx.fillStyle = hpGrad;
  ctx.fillRect(18, 34, 200 * hpPct, 12);
  ctx.strokeStyle = '#440000';
  ctx.lineWidth = 1;
  ctx.strokeRect(18, 34, 200, 12);
  ctx.fillStyle = '#fff';
  ctx.font = '9px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(`HP ${player.hp}/${player.maxHp}`, 118, 44);

  // MP bar
  const mpPct = player.mp / player.maxMp;
  ctx.fillStyle = '#000033';
  ctx.fillRect(18, 50, 200, 10);
  const mpGrad = ctx.createLinearGradient(18, 0, 218, 0);
  mpGrad.addColorStop(0, '#0000cc');
  mpGrad.addColorStop(1, '#4444ff');
  ctx.fillStyle = mpGrad;
  ctx.fillRect(18, 50, 200 * mpPct, 10);
  ctx.strokeStyle = '#000044';
  ctx.strokeRect(18, 50, 200, 10);
  ctx.fillStyle = '#aaf';
  ctx.font = '9px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(`MP ${player.mp}/${player.maxMp}`, 118, 58);

  // EXP bar
  const expPct = player.exp / player.expNeeded;
  ctx.fillStyle = '#111100';
  ctx.fillRect(18, 64, 200, 8);
  ctx.fillStyle = '#aacc00';
  ctx.fillRect(18, 64, 200 * expPct, 8);
  ctx.strokeStyle = '#334400';
  ctx.strokeRect(18, 64, 200, 8);
  ctx.fillStyle = '#ccff44';
  ctx.font = '8px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(`EXP ${player.exp}/${player.expNeeded}`, 118, 71);

  // Active buff chip below the stat panel
  if (player.buffTimer > 0) {
    const secs = Math.ceil(player.buffTimer / 1000);
    ctx.fillStyle = 'rgba(120,20,20,0.85)';
    roundRect(ctx, 8, 94, 118, 20, 5);
    ctx.fill();
    ctx.strokeStyle = '#ff5050';
    ctx.lineWidth = 1;
    roundRect(ctx, 8, 94, 118, 20, 5);
    ctx.stroke();
    ctx.fillStyle = '#ffb0a0';
    ctx.font = 'bold 10px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`⚔ RAGE ×${player.buffAtk} · ${secs}s`, 16, 108);
  }

  // Stats panel (top right)
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  roundRect(ctx, W - 170, 8, 162, 70, 8);
  ctx.fill();
  ctx.strokeStyle = '#4a2a7a';
  roundRect(ctx, W - 170, 8, 162, 70, 8);
  ctx.stroke();

  ctx.fillStyle = '#FFD700';
  ctx.font = '11px monospace';
  ctx.textAlign = 'left';
  ctx.fillText(`ATK: ${player.atk}`, W - 160, 26);
  ctx.fillText(`SPD: +${player.spd}`, W - 160, 40);
  ctx.fillStyle = '#FFD700';
  ctx.fillText(`Meso: ${player.meso}`, W - 160, 54);
  ctx.fillStyle = '#aaa';
  ctx.fillText(`Kills: ${totalMobsKilled}`, W - 160, 68);

  // Map name (top center)
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  const mapNameW = ctx.measureText(map.name).width + 20;
  roundRect(ctx, W / 2 - mapNameW / 2, 8, mapNameW, 24, 6);
  ctx.fill();
  ctx.fillStyle = '#88ddff';
  ctx.font = '12px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(map.name, W / 2, 24);

  // Controls reminder (bottom)
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(0, H - 24, W, 24);
  ctx.fillStyle = '#888';
  ctx.font = '10px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('←→ Move  Space Jump  ↑ Rope  Z Atk  Q/E/R Skills  F Pick  I Inv  X/C Potion', W / 2, H - 8);
}

function drawSkillBar() {
  const barY = H - 55;
  const startX = W / 2 - (player.skills.length * 55) / 2;
  for (let i = 0; i < player.skills.length; i++) {
    const s = player.skills[i];
    const sx = startX + i * 55;
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    roundRect(ctx, sx, barY, 48, 48, 6);
    ctx.fill();
    ctx.strokeStyle = s.cooldown > 0 ? '#333' : s.color;
    ctx.lineWidth = 2;
    roundRect(ctx, sx, barY, 48, 48);
    ctx.stroke();

    if (s.cooldown > 0) {
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      const cdH = 48 * (s.cooldown / s.maxCd);
      ctx.fillRect(sx + 2, barY + 48 - cdH, 44, cdH);
    }

    ctx.fillStyle = s.color;
    ctx.shadowBlur = s.cooldown > 0 ? 0 : 6;
    ctx.shadowColor = s.color;
    ctx.font = 'bold 10px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(s.name.split(' ')[0], sx + 24, barY + 22);
    ctx.fillStyle = '#fff';
    ctx.font = '9px monospace';
    ctx.fillText(`[${s.key.replace('Key', '')}]`, sx + 24, barY + 34);
    ctx.fillText(`${s.mpCost}mp`, sx + 24, barY + 44);
    ctx.shadowBlur = 0;
  }
}

function drawDeadScreen() {
  ctx.fillStyle = 'rgba(0,0,0,0.75)';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#FF2233';
  ctx.font = 'bold 48px monospace';
  ctx.textAlign = 'center';
  ctx.shadowBlur = 20;
  ctx.shadowColor = '#FF0000';
  ctx.fillText('YOU DIED', W / 2, H / 2 - 40);
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#aaa';
  ctx.font = '18px monospace';
  ctx.fillText('10% EXP & Meso lost', W / 2, H / 2);
  ctx.fillStyle = '#fff';
  ctx.font = '20px monospace';
  const blink = Math.floor(Date.now() / 500) % 2 === 0;
  if (blink) ctx.fillText('Press SPACE to respawn', W / 2, H / 2 + 40);
}

function drawLevelUp() {
  ctx.save();
  const alpha = Math.min(levelUpTimer / 30, 1);
  ctx.globalAlpha = alpha;
  ctx.fillStyle = '#FFD700';
  ctx.font = 'bold 42px monospace';
  ctx.textAlign = 'center';
  ctx.shadowBlur = 30;
  ctx.shadowColor = '#FFD700';
  ctx.fillText(`LEVEL UP! → ${player.level}`, W / 2, H / 2 - 60);
  ctx.font = '18px monospace';
  ctx.fillStyle = '#fff';
  const c = player.cls;
  ctx.fillText(`HP+${c.hpPerLv}  MP+${c.mpPerLv}  ATK+${c.atkPerLv}`, W / 2, H / 2 - 20);
  ctx.restore();
}

function drawClassSelect() {
  ctx.fillStyle = 'rgba(10,5,25,0.92)';
  ctx.fillRect(0, 0, W, H);

  // Title
  ctx.fillStyle = '#ffcf3a';
  ctx.font = 'bold 42px monospace';
  ctx.textAlign = 'center';
  ctx.shadowBlur = 18; ctx.shadowColor = '#ff9a1e';
  ctx.fillText('MapleStory', W / 2, 70);
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#9fd0ff';
  ctx.font = '16px monospace';
  ctx.fillText('Choose your job', W / 2, 100);

  const cardW = 250, gap = 30, cardH = 280, cardY = 150;
  const total = CLASSES.length * cardW + (CLASSES.length - 1) * gap;
  const startX = W / 2 - total / 2;

  for (let i = 0; i < CLASSES.length; i++) {
    const c = CLASSES[i];
    const x = startX + i * (cardW + gap);
    const sel = i === classHover;

    ctx.fillStyle = sel ? 'rgba(60,40,100,0.95)' : 'rgba(30,20,55,0.9)';
    roundRect(ctx, x, cardY, cardW, cardH, 12);
    ctx.fill();
    ctx.lineWidth = sel ? 4 : 2;
    ctx.strokeStyle = sel ? c.trim : '#4a2a7a';
    if (sel) { ctx.shadowBlur = 18; ctx.shadowColor = c.trim; }
    roundRect(ctx, x, cardY, cardW, cardH, 12);
    ctx.stroke();
    ctx.shadowBlur = 0;

    // Emblem figure
    drawClassEmblem(x + cardW / 2, cardY + 95, c);

    // Name
    ctx.fillStyle = c.trim;
    ctx.font = 'bold 24px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(c.name, x + cardW / 2, cardY + 150);

    // Stats
    ctx.font = '13px monospace';
    ctx.fillStyle = '#ddd';
    ctx.fillText(`HP ${c.maxHp}   MP ${c.maxMp}   ATK ${c.atk}`, x + cardW / 2, cardY + 176);
    ctx.fillStyle = '#aaa';
    ctx.font = '12px monospace';
    wrapText(c.blurb, x + cardW / 2, cardY + 200, cardW - 30, 16);

    // Skills
    ctx.fillStyle = c.trim;
    ctx.font = '11px monospace';
    for (let s = 0; s < c.skills.length; s++) {
      ctx.fillText(`[${c.skills[s].key.replace('Key', '')}] ${c.skills[s].name}`, x + cardW / 2, cardY + 234 + s * 15);
    }

    if (sel) {
      ctx.fillStyle = '#ffcf3a';
      ctx.font = 'bold 13px monospace';
      const pulse = Math.floor(Date.now() / 400) % 2 === 0;
      if (pulse) ctx.fillText('▶ TAP / PRESS Z ◀', x + cardW / 2, cardY + cardH - 8);
    }
  }

  // Continue banner if a save exists
  const save = getSave();
  if (save) {
    const bw = 340, bx = W / 2 - bw / 2, by = 448;
    const pulse = 0.75 + Math.sin(Date.now() / 350) * 0.25;
    ctx.save();
    ctx.globalAlpha = pulse;
    ctx.fillStyle = 'rgba(20,60,30,0.9)';
    roundRect(ctx, bx, by, bw, 34, 8); ctx.fill();
    ctx.strokeStyle = '#50d070'; ctx.lineWidth = 2;
    roundRect(ctx, bx, by, bw, 34, 8); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#a0ffb8';
    ctx.font = 'bold 13px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(`▶ CONTINUE  Lv.${save.level} ${CLASSES[save.classIdx].name} · ${MAPS[Math.min(save.mapIdx || 0, MAPS.length - 1)].name.split(' — ')[0]}  [C]`, W / 2, by + 22);
    ctx.restore();
  }

  ctx.fillStyle = '#888';
  ctx.font = '12px monospace';
  ctx.fillText(isTouchDevice ? 'Tap a card to highlight, tap again to start' : '◀ ▶ or 1/2/3 to choose   ·   Z / Space to start', W / 2, H - 24);
}

function drawClassEmblem(cx, cy, c) {
  // Mini chibi preview
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(cx, cy + 36, 22, 6, 0, 0, Math.PI * 2); ctx.fill();
  // body
  ctx.fillStyle = c.color;
  ctx.fillRect(cx - 14, cy + 4, 28, 24);
  ctx.fillStyle = c.trim;
  ctx.fillRect(cx - 3, cy + 4, 4, 24);
  // head
  ctx.fillStyle = '#ffdfc4';
  ctx.fillRect(cx - 16, cy - 28, 32, 30);
  ctx.fillStyle = '#fff';
  ctx.fillRect(cx - 9, cy - 16, 5, 8); ctx.fillRect(cx + 4, cy - 16, 5, 8);
  ctx.fillStyle = '#3a2a4a';
  ctx.fillRect(cx - 7, cy - 14, 3, 5); ctx.fillRect(cx + 6, cy - 14, 3, 5);
  // headgear
  ctx.fillStyle = c.hair;
  ctx.fillRect(cx - 16, cy - 30, 32, 8);
  if (c.id === 'warrior') {
    ctx.fillStyle = '#b8b8c0'; ctx.fillRect(cx - 16, cy - 32, 32, 8);
    ctx.fillStyle = '#d04040'; ctx.fillRect(cx - 3, cy - 40, 6, 9);
  } else if (c.id === 'magician') {
    ctx.fillStyle = c.color;
    ctx.beginPath(); ctx.moveTo(cx - 18, cy - 28); ctx.lineTo(cx + 18, cy - 28); ctx.lineTo(cx, cy - 52); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffe84a'; ctx.fillRect(cx - 2, cy - 44, 4, 4);
  } else {
    ctx.fillStyle = c.color; ctx.fillRect(cx - 16, cy - 32, 32, 8);
    ctx.fillStyle = '#e0e060';
    ctx.beginPath(); ctx.moveTo(cx + 12, cy - 30); ctx.lineTo(cx + 30, cy - 40); ctx.lineTo(cx + 14, cy - 24); ctx.fill();
  }
  // weapon hint
  ctx.fillStyle = '#dfe6ef';
  if (c.weapon === 'sword') ctx.fillRect(cx + 16, cy - 20, 5, 40);
  else if (c.weapon === 'staff') { ctx.fillStyle = '#7a5a2a'; ctx.fillRect(cx + 17, cy - 24, 4, 48); ctx.fillStyle = c.trim; ctx.beginPath(); ctx.arc(cx + 19, cy - 26, 6, 0, Math.PI * 2); ctx.fill(); }
  else { ctx.strokeStyle = '#8a5a2a'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(cx + 20, cy + 2, 18, -1.2, 1.2); ctx.stroke(); }
  ctx.restore();
}

function wrapText(text, cx, y, maxW, lh) {
  const words = text.split(' ');
  let line = '', yy = y;
  for (const w of words) {
    const test = line + w + ' ';
    if (ctx.measureText(test).width > maxW && line) { ctx.fillText(line.trim(), cx, yy); line = w + ' '; yy += lh; }
    else line = test;
  }
  ctx.fillText(line.trim(), cx, yy);
}

function drawNextMap() {
  ctx.fillStyle = 'rgba(0,200,255,0.15)';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#00FFFF';
  ctx.font = 'bold 32px monospace';
  ctx.textAlign = 'center';
  ctx.shadowBlur = 20;
  ctx.shadowColor = '#00FFFF';
  const next = currentMapIdx + 1;
  const name = next < MAPS.length ? MAPS[next].name : MAPS[0].name;
  ctx.fillText(`Entering: ${name}`, W / 2, H / 2);
  ctx.shadowBlur = 0;
}

// ─── Utilities ────────────────────────────────────────────────────────────────
function roundRect(ctx, x, y, w, h, r = 4) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function shadeColor(hex, amount) {
  const num = parseInt(hex.slice(1), 16);
  const r = Math.max(0, Math.min(255, (num >> 16) + amount));
  const g = Math.max(0, Math.min(255, ((num >> 8) & 0xff) + amount));
  const b = Math.max(0, Math.min(255, (num & 0xff) + amount));
  return `rgb(${r},${g},${b})`;
}

// ─── Main loop ────────────────────────────────────────────────────────────────
function loop(ts) {
  update(ts);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
